name: Release

# A `v*` tag, pushed from git or created by a GitHub release in the web UI,
# builds everything a release publishes and attaches it to that tag's release.
# Every job hands its output on as a workflow artifact, and only `publish`, the
# last, writes to the release: a failure anywhere attaches nothing.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The controller release carries the Erlang runtime of the machine that built
  # it, and its dependencies' C code, so it is built on each platform's own
  # runner and run there once before anything is published.
  controller-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-x86_64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: macos-15-intel, platform: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Erlang and Elixir
        uses: ./.github/actions/setup-beam
        with:
          cache: "false"

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      # The Kafka checksum library the release ships builds with cmake.
      - run: cmake --version

      - name: Build and pack the release
        run: make release-archive

      - name: Build the runner the smoke test connects
        run: cargo build -p rust_runner

      - name: Smoke-test the archive on its own platform
        run: |
          scripts/release-archive.sh smoke \
            "_build/.dist/controller/$(scripts/release-archive.sh name ${{ matrix.platform }})" \
            _build/.target/debug/rust_runner

      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.platform }}
          path: _build/.dist/controller/*.tar.gz
          # Everything under `_build/.dist` counts as hidden to this action.
          include-hidden-files: true
          if-no-files-found: error

  # The two release artefacts this repository cannot cross-build, both for the
  # same reason and neither fixable with zig:
  #
  #   the Node addon   its target is `x86_64-pc-windows-msvc`, the ABI the
  #                    published `@flezha/sdk-win32-x64-msvc` package declares,
  #                    and zig cannot produce the MSVC ABI
  #   the wheels       maturin writes the module's export list from
  #                    `module-name`, and the dotted `flezha.flz_core_ffi` it
  #                    needs there does not link under the mingw linker, for
  #                    the abi3 tier and the free-threaded one alike
  #
  # Both are built here and handed to the staging job, which refuses a release
  # that is missing either of them by name.
  release-windows-artefacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # The free-threaded interpreter first, so the default one set up after it
      # is `python` while `python3.14t` stays on PATH for its wheel tier.
      - name: Set up the free-threaded Python the release publishes a wheel for
        uses: ./.github/actions/setup-python
        with:
          version: "3.14t"

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Build the napi addon
        run: cargo build --release -p flz_core_ffi --features napi

      - name: Stage it under its platform suffix
        shell: bash
        run: |
          mkdir -p _build/.dist/node-addons/win32-x64-msvc
          cp _build/.target/release/flz_core_ffi.dll _build/.dist/node-addons/win32-x64-msvc/flz_core_ffi.node

      - name: Build the abi3 and free-threaded wheels
        shell: bash
        run: |
          pip install --quiet maturin
          cd sdk/python
          maturin build --release --out ../../_build/.dist/wheels --features python-abi3
          maturin build --release --out ../../_build/.dist/wheels --interpreter python3.14t

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artefacts
          path: |
            _build/.dist/node-addons/win32-x64-msvc/flz_core_ffi.node
            _build/.dist/wheels/*.whl
          # Everything under `_build/.dist` counts as hidden to this action.
          include-hidden-files: true
          if-no-files-found: error

  # The five-triple cross-build, on a version tag and nowhere else. This is the
  # narrow reinstatement of what `2026-04-25-slim-app-footprint` removed: a
  # release needs every supported platform, a pull request needs one.
  release-artifacts:
    needs: [release-windows-artefacts, controller-archive]
    runs-on: ubuntu-latest
    steps:
      # The SDKs the release packages are submodules.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # First, before anything is built. Every entry in the publication
      # readiness record is a decision this release makes permanent, and on a
      # registry it is too late by definition: a name cannot be reclaimed, a
      # clone cannot be recalled, a published SDK cannot be withdrawn. An OWED
      # entry does not stop the release; an open BLOCKING one does.
      - name: Publication readiness
        run: python3 scripts/run_gates.py --run @release

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          cache: maven

      - name: Install Rust
        # No cargo cache: a release build starts from the tag's own tree.
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # The build stages the Node addons and the abi3 wheels as well as the
      # libraries and the jars, so it needs both toolchains.
      - name: Set up Node
        uses: ./.github/actions/setup-node

      # The free-threaded interpreter first, so the default one set up after it
      # is `python3` while `python3.14t` stays on PATH for its wheel tier.
      - name: Set up the free-threaded Python the release publishes a wheel for
        uses: ./.github/actions/setup-python
        with:
          version: "3.14t"

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # The platform gems are built in rb-sys-dock's images, one per platform,
      # at the rb_sys version the gem itself requires.
      - name: Set up Ruby and rb-sys-dock
        uses: ./.github/actions/setup-ruby

      - run: |
          gem install --no-document rb_sys -v "$(ruby -e 'puts Gem::Specification.load("sdk/ruby/flezha.gemspec").dependencies.find { |d| d.name == "rb_sys" }.requirement')"

      - name: Install maturin
        run: |
          scripts/build-python-sdk.sh
          sdk/python/.venv/bin/pip install --quiet maturin

      - name: Take the Windows artefacts from their own runner
        uses: actions/download-artifact@v4
        with:
          name: windows-artefacts
          path: _build/.dist

      - name: Take the controller archives from their own runners
        uses: actions/download-artifact@v4
        with:
          pattern: controller-*
          merge-multiple: true
          path: _build/.dist/controller

      - name: Build all five triples, the wheels, the gems and both fat jars
        # The same script that is run locally. It installs cargo-zigbuild and a
        # ziglang venv itself, so nothing here pins a second copy of that.
        run: scripts/build-dist.sh --host

      - name: Stage the assets and their SHA-256 manifest
        run: scripts/build-dist.sh --stage-release dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-release/
          if-no-files-found: error

  # The two macOS libraries are cross-built on Linux; each is opened once on a
  # Mac of its own chip, which proves it is a loadable Mach-O whose dependencies
  # resolve. The SDKs' own repositories run them.
  macos-sdk-load:
    needs: release-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, dir: macos-arm64 }
          - { runner: macos-15-intel, dir: macos-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-release

      - name: Load libflz_core_ffi on its own chip
        run: |
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1]).flz_core_context_new' \
            "dist-release/libflz_core_ffi-${{ matrix.dir }}.dylib"

  publish:
    needs: [release-artifacts, macos-sdk-load]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-release

      - name: Publish them to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A semver pre-release tag (v0.1.0-rc.1, v0.0.0-dev.1) carries a `-`
          # after the version. Mark those, so a trial run of this job cannot be
          # mistaken for a shipped version — and so it never becomes "latest".
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $prerelease dist-release/*
          fi
