name: Java SDK

on:
  pull_request:
    paths:
      - "sdk/java"
      - "crates/flz_core/**"
      - "crates/flz_core_ffi/**"
      - "crates/flz_transport/**"
      - "protobufs/**"
      - "test/fixtures/jni_surface.txt"
      - "lib/flezha/runner/fleet_manager.ex"
      - "lib/flezha/relay/overwatch.ex"
      - "lib/flezha/service/relay_manager.ex"
      - "test/helpers/node_test_helper.ex"
      - "test/system/sdk_smoke_e2e_test.exs"
      - ".github/workflows/java-sdk.yml"
      - "scripts/gate_rows.py"
  # No `paths:` here, deliberately. A path filter is evaluated against the
  # commits a push carries, and a tag pushed onto an existing commit carries
  # none — so a filtered push trigger would skip the release job every time.
  # The pull-request trigger above keeps its filter, which is where the cost is.
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# No build artifact is tracked in git. Every job here builds what it needs.
#
# Pull requests build the HOST triple only — `scripts/build-native.sh` with no
# --targets — because the suites run on the machine they run on. They never
# install zig or cargo-zigbuild and never cross-compile: that property is the
# whole reason the artifacts were committed in the first place, and it is kept.
#
# The five-triple cross-build lives in `release-artifacts`, which runs on a
# version tag only and publishes the five binaries, both fat jars and a SHA-256
# manifest as GitHub Release assets. `mvn -P native-build` fetches those assets
# for anyone assembling a portable jar.

jobs:
  # The veneer is a feature of this repository's `flz_core_ffi`. Its JNI exports,
  # its declared table, `test/fixtures/jni_surface.txt` and the submodule's
  # `FlzCore.java` are held equal here; the Java repository holds the class
  # against the same fixture. The Java suites, their coverage and the format
  # check run in `flezha/flezha_java_sdk`, where the SDK is developed.
  veneer:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Assert the Java native surface against the declared table
        run: python3 scripts/naming_gate.py --run rust-test-ffi-jni

  # Java <-> Elixir integration matrix: end to end, which is the half the Java
  # repository cannot run. The submodule is what it runs the Java runtime from,
  # at the commit this tree pins. Flezha.Testnet is a child of
  # Flezha.Application in :test env and boots `test/apps/testnet`'s bundle, so
  # the action builds it first.
  mix-integration-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Set up Node.js (for the testnet build)
        uses: ./.github/actions/setup-node
        with:
          deps-dir: test/apps/testnet

      - uses: ./.github/actions/sdk-smoke
        with:
          runtime: java
          testnet: "true"

  # The two release artefacts this repository cannot cross-build, both for the
  # same reason and neither fixable with zig:
  #
  #   the Node addon   its target is `x86_64-pc-windows-msvc`, the ABI the
  #                    published `@flezha/sdk-win32-x64-msvc` package declares,
  #                    and zig cannot produce the MSVC ABI
  #   the wheels       maturin writes the module's export list from
  #                    `module-name`, and the dotted `flezha.flz_core_ffi` it
  #                    needs there does not link under the mingw linker, for
  #                    the abi3 tier and the free-threaded one alike
  #
  # Both are built here and handed to the staging job, which refuses a release
  # that is missing either of them by name.
  release-windows-artefacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # The free-threaded interpreter first, so the default one set up after it
      # is `python` while `python3.14t` stays on PATH for its wheel tier.
      - name: Set up the free-threaded Python the release publishes a wheel for
        uses: ./.github/actions/setup-python
        with:
          version: "3.14t"

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Build the napi addon
        run: cargo build --release -p flz_core_ffi --features napi

      - name: Stage it under its platform suffix
        shell: bash
        run: |
          mkdir -p dist/node-addons/win32-x64-msvc
          cp target/release/flz_core_ffi.dll dist/node-addons/win32-x64-msvc/flz_core_ffi.node

      - name: Build the abi3 and free-threaded wheels
        shell: bash
        run: |
          pip install --quiet maturin
          cd sdk/python
          maturin build --release --out ../../dist/wheels --features python-abi3
          maturin build --release --out ../../dist/wheels --interpreter python3.14t

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artefacts
          path: |
            dist/node-addons/win32-x64-msvc/flz_core_ffi.node
            dist/wheels/*.whl
          if-no-files-found: error

  # The five-triple cross-build, on a version tag and nowhere else. This is the
  # narrow reinstatement of what `2026-04-25-slim-app-footprint` removed: a
  # release needs every supported platform, a pull request needs one.
  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-windows-artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The SDKs the release packages are submodules.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # First, before anything is built. Every entry in the publication
      # readiness record is a decision this release makes permanent, and on a
      # registry it is too late by definition: a name cannot be reclaimed, a
      # clone cannot be recalled, a published SDK cannot be withdrawn. An OWED
      # entry does not stop the release; an open BLOCKING one does.
      - name: Publication readiness
        run: python3 scripts/naming_gate.py --run @release

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          cache: maven

      - name: Install Rust
        # No cargo cache: a release build starts from the tag's own tree.
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      # The build stages the Node addons and the abi3 wheels as well as the
      # libraries and the jars, so it needs both toolchains.
      - name: Set up Node
        uses: ./.github/actions/setup-node

      # The free-threaded interpreter first, so the default one set up after it
      # is `python3` while `python3.14t` stays on PATH for its wheel tier.
      - name: Set up the free-threaded Python the release publishes a wheel for
        uses: ./.github/actions/setup-python
        with:
          version: "3.14t"

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # The platform gems are built in rb-sys-dock's images, one per platform,
      # at the rb_sys version the gem itself requires.
      - name: Set up Ruby and rb-sys-dock
        uses: ./.github/actions/setup-ruby

      - run: |
          gem install --no-document rb_sys -v "$(ruby -e 'puts Gem::Specification.load("sdk/ruby/flezha.gemspec").dependencies.find { |d| d.name == "rb_sys" }.requirement')"

      - name: Install maturin
        run: |
          scripts/build-python-sdk.sh
          sdk/python/.venv/bin/pip install --quiet maturin

      - name: Take the Windows artefacts from their own runner
        uses: actions/download-artifact@v4
        with:
          name: windows-artefacts
          path: dist

      - name: Build all five triples, the wheels, the gems and both fat jars
        # The same script that is run locally. It installs cargo-zigbuild and a
        # ziglang venv itself, so nothing here pins a second copy of that.
        run: scripts/build-dist.sh --host

      - name: Stage the assets and their SHA-256 manifest
        run: scripts/build-dist.sh --stage-release dist-release

      - name: Publish them to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A semver pre-release tag (v0.1.0-rc.1, v0.0.0-dev.1) carries a `-`
          # after the version. Mark those, so a trial run of this job cannot be
          # mistaken for a shipped version — and so it never becomes "latest".
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $prerelease dist-release/*
          fi
