name: Java SDK

on:
  pull_request:
    paths:
      - "sdk/java/**"
      - "flz_jni/**"
      - "flz_transport/**"
      - "protobufs/**"
      - "test/apps/java_executor/**"
      - "test/helpers/node_test_helper.ex"
      - "test/java_sdk/**"
      - ".github/workflows/java-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/java/**"
      - "flz_jni/**"
      - "flz_transport/**"
      - "protobufs/**"
      - "test/apps/java_executor/**"
      - "test/helpers/node_test_helper.ex"
      - "test/java_sdk/**"
      - ".github/workflows/java-sdk.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Built artifacts that are *committed*:
#   - Native binaries (libflz_transport.{so,dylib,dll} × 5 platforms) under
#       sdk/java/flezha-sdk-native/src/main/resources/native/<sdk-dir>/
#   - SDK fat jar at  sdk/java/flezha-sdk/dist/flezha-sdk.jar
#   - Test executor fat jar at
#       test/apps/java_executor/dist/java_executor.jar
#
# Refresh all of them locally with one command (`scripts/build-dist.sh`),
# then `git add` + commit. CI never invokes the build script, never runs
# cargo-zigbuild, never cross-compiles.

jobs:
  # Java-side unit tests + JaCoCo coverage. The `-P native-verify` profile
  # asserts the committed natives are present without rebuilding them, and
  # there's no "package fat jar" step (the fat jar is committed too).
  java-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify (compile + unit + JaCoCo) against committed natives
        run: mvn -B -f sdk/java/pom.xml -P coverage,native-verify verify

  # Java <-> Elixir integration matrix. Runs in parallel with java-unit-tests
  # — both consume committed artefacts, so neither blocks the other.
  mix-integration-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc 23.4
        # `mix compile` in lib/flezha/executor/commands_proto.ex uses
        # `Protox`, which shells out to system protoc. Installed manually
        # from the GitHub release so no JavaScript action is involved
        # (arduino/setup-protoc still ships on Node 20 and trips the
        # runner's deprecation warning).
        run: |
          PROTOC_VERSION=23.4
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -oq /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          protoc --version

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Node.js (for testnet build)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache testnet node_modules
        uses: actions/cache@v5
        with:
          path: test/apps/testnet/node_modules
          key: testnet-${{ runner.os }}-${{ hashFiles('test/apps/testnet/package-lock.json', 'test/apps/testnet/package.json') }}

      - name: Build testnet
        # Flezha.Testnet is a child of Flezha.Application in :test env
        # (config/test.exs sets testnet_enabled: true) and spawns
        # `npm start --prefix test/apps/testnet` at boot, which runs
        # `node dist/index.js`. dist/ is gitignored, so it has to be
        # built before mix test boots the application.
        working-directory: test/apps/testnet
        run: |
          npm ci || npm install
          npm run build

      - name: Elixir dependencies
        run: mix deps.get

      - name: Pre-build rust_executor
        # PortPilot launches two `cargo run --quiet` processes for
        # rust_executor at boot; BootLoader's post_hook gives
        # them 20s to connect (config/test.exs). A cold debug build
        # of the binary + workspace deps doesn't fit in that window,
        # so build it ahead of time into the same ./target dir the
        # cargo-run command uses.
        run: |
          cargo build --quiet \
            --manifest-path=test/apps/rust_executor/Cargo.toml \
            --target-dir=./target

      - name: Run Java SDK integration matrix
        run: mix test.java_sdk
