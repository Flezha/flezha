apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flezha-daemonset
  namespace: flezha
spec:
  selector:
    matchLabels:
      app: flezha
  template:
    metadata:
      labels:
        app: flezha
    spec:
      serviceAccountName: flezha-reader
      imagePullSecrets:
        - name: dockerhub-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              mkdir -p /flezha/sockets /flezha/data /flezha/certs /var/log/flezha /var/lib/flezha && \
              chown -R 1000:1000 /flezha/sockets /flezha/data /flezha/certs /var/log/flezha /var/lib/flezha && \
              chmod -R 755 /flezha/sockets /flezha/data /flezha/certs /var/log/flezha /var/lib/flezha
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: flezha-sockets
              mountPath: /flezha/sockets
            - name: flezha-data
              mountPath: /flezha/data
            - name: flezha-certs
              mountPath: /flezha/certs
            - name: flezha-logs
              mountPath: /var/log/flezha
            - name: flezha-recovery
              mountPath: /var/lib/flezha
      containers:
        - name: flezha
          # Update VERSION tag before deploying
          image: alfetahe/flezha:dev-latest
          imagePullPolicy: Always
          ports:
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: quic
              containerPort: 4433
              protocol: UDP
          # Pull env vars from ConfigMap (flezha-configmap.yaml)
          envFrom:
            - configMapRef:
                name: flezha-config
          env:
            - name: FLEZHA_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLEZHA_NODE_NAME
              value: "flezha"
            - name: FLEZHA_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLEZHA_K8S_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: FLEZHA_K8S_SELECTOR
              value: "app=flezha"
            - name: FLEZHA_SOCKET_FILES_PATH
              value: "/flezha/sockets"
          volumeMounts:
            - name: flezha-sockets
              mountPath: /flezha/sockets
            - name: flezha-data
              mountPath: /flezha/data
            - name: flezha-certs
              mountPath: /flezha/app_data/certs
            - name: flezha-logs
              mountPath: /var/log/flezha
            - name: flezha-recovery
              # Must match FLEZHA_DATA_DIR in the ConfigMap. The DETS file lives
              # here; losing this volume reverts agents to today's behaviour of
              # empty recovery on restart.
              mountPath: /var/lib/flezha
      volumes:
        - name: flezha-sockets
          hostPath:
            path: /opt/flezha-sockets
            type: DirectoryOrCreate
        - name: flezha-data
          hostPath:
            path: /opt/flezha-data
            type: DirectoryOrCreate
        - name: flezha-certs
          # Per-node hostPath: certs auto-generated on first run, persisted across pod restarts
          hostPath:
            path: /opt/flezha-certs
            type: DirectoryOrCreate
        - name: flezha-logs
          hostPath:
            path: /opt/flezha-logs
            type: DirectoryOrCreate
        - name: flezha-recovery
          # Node-local host path for the recovery DETS file. DaemonSet means
          # each pod is pinned to a node, so a host path is sufficient — the
          # same pod comes back to the same node's /opt/flezha-recovery dir
          # after a restart and reads the file it wrote before going down.
          hostPath:
            path: /opt/flezha-recovery
            type: DirectoryOrCreate
