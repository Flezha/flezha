name: PHP SDK

# What this repository still owns for PHP. The package's own suite and its
# format check live in `flezha/flezha_php_sdk` now, where the package is
# developed; `sdk/php` here is that repository as a submodule, pinned to a
# commit. What cannot move is on this side of the pin: end to end needs the
# controller, and the threaded executor's arm needs the thread-safe image this
# tree builds.
#
# A change to the SDK reaches this job when the pin is bumped, which is the
# change that brings it into end to end at all.

on:
  pull_request:
    paths:
      - "sdk/php"
      - "crates/flz_core/**"
      - "crates/flz_core_ffi/**"
      - "crates/flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-php-sdk.sh"
      - "deploy/docker/dev/Dockerfile.php"
      - ".github/workflows/php-sdk.yml"
      - "scripts/gate_rows.py"
  push:
    branches: [main]
    paths:
      - "sdk/php"
      - "crates/flz_core/**"
      - "crates/flz_core_ffi/**"
      - "crates/flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-php-sdk.sh"
      - "deploy/docker/dev/Dockerfile.php"
      - ".github/workflows/php-sdk.yml"
      - "scripts/gate_rows.py"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The package's gates from the one gate list: its suites, the threaded
  # executor's arm on the thread-safe build most distributions do not ship, and
  # end to end, which is the half an SDK repository cannot run: it needs the
  # controller. The submodule is what this job runs the PHP runtime from, at the
  # commit this tree pins. The ZTS PHP + Swoole image is cached, so a
  # reproduction is a container away rather than a local source build, and the
  # arm runs on every change to the SDK rather than nightly: an arm that only
  # runs when someone remembers to set an environment variable is an arm that
  # rots.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up PHP
        uses: ./.github/actions/setup-php

      - name: Cache the ZTS PHP + Swoole image
        uses: actions/cache@v5
        with:
          path: /tmp/php-zts-image
          key: php-zts-${{ hashFiles('deploy/docker/dev/Dockerfile.php') }}

      - name: Build or restore the ZTS image
        run: |
          set -euo pipefail
          if [ -f /tmp/php-zts-image/image.tar ]; then
            docker load -i /tmp/php-zts-image/image.tar
          else
            docker build -f deploy/docker/dev/Dockerfile.php --target zts -t flezha-php-zts .
            mkdir -p /tmp/php-zts-image
            docker save -o /tmp/php-zts-image/image.tar flezha-php-zts
          fi

      - uses: ./.github/actions/sdk-smoke
        with:
          runtime: php
