[package]
name = "flz_transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flezha shared transport library — QUIC, UDS, binary framing"

[lib]
name = "flz_transport"
crate-type = ["rlib"]

[features]
# The in-memory QUIC pair harness, compiled into the library so `flz_nif`'s
# tests drive one definition of a stalled peer rather than a second copy.
test-support = []

[dependencies]
byteorder = "1.4"
crossbeam.workspace = true
mio.workspace = true
quinn-proto.workspace = true
bytes.workspace = true
# Already in the graph via rustls; the direct dependency is one call, the
# SHA-256 that bounds a data socket's runner-id field.
ring = "0.17"
rustls.workspace = true
rustls-pemfile.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the graph via mio; the direct dependency is one call, `getuid`,
# for the access-denied diagnosis.
libc.workspace = true

[lints]
workspace = true
