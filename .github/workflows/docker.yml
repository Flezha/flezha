name: Docker

# PR-only build check: builds the prod (`:latest`) and runtime-dev
# (`:latest-dev`) controller images and fails if either exceeds its size
# budget. It NEVER pushes. All publishing to Docker Hub is done by
# scripts/publish-image.sh, which builds natively per architecture and
# assembles the multi-arch manifest — keeping a single publisher so CI can't
# clobber the manifest with a single-arch push.
#
# Per the no-QEMU/buildx policy, multi-arch images are never cross-compiled;
# each architecture builds on its own hardware.

on:
  pull_request:
    paths:
      - "docker/prod/**"
      - "docker/dev/Dockerfile.runtime"
      - "test/apps/testnet"
      - "test/apps/testnet/**"
      - "mix.exs"
      - "mix.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/flz_nif/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "scripts/gate_rows.py"

jobs:
  docker-size-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build prod image
        run: |
          docker build \
            -f docker/prod/Dockerfile.controller \
            -t flezha/flezha:latest \
            .

      - name: Build runtime-dev image (FROM :latest)
        run: |
          docker build \
            -f docker/dev/Dockerfile.runtime \
            -t flezha/flezha:latest-dev \
            .

      - name: Enforce size budgets
        # Row `image-size` in scripts/gate_rows.py: the budgets, the measured
        # sizes and the step-summary table.
        run: python3 scripts/naming_gate.py --run @docker
