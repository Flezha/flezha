name: Rust SDK Bench Cron

# Weekly trend run: `mix bench` matrix (rust × java) × (uds × quic) on main,
# plus the Criterion micro-benches. Posts a summary comment to a tracking
# issue (created on first run, reused thereafter). Non-blocking — this is
# a drift detector, not a merge gate.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  matrix-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [rust, java]
        transport: [uds, quic]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-beam
      - uses: ./.github/actions/setup-java
        if: matrix.runtime == 'java'

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      - name: mix compile
        run: MIX_ENV=prod mix compile

      - name: Build ${{ matrix.runtime }} compute engine
        run: |
          if [[ "${{ matrix.runtime }}" == "rust" ]]; then
            cargo build --release -p rust_runner
            cargo build -p rust_runner
          else
            mvn -B -q -f test/apps/java_runner/pom.xml -DskipTests package
          fi

      - name: Run mix bench — ${{ matrix.runtime }} / ${{ matrix.transport }}
        env:
          FLEZHA_TRANSPORT: ${{ matrix.transport }}
        run: |
          MIX_ENV=prod mix bench \
            --runtime ${{ matrix.runtime }} \
            -n 100 -m 10000 \
            2>&1 | tee bench-${{ matrix.runtime }}-${{ matrix.transport }}.txt

      - uses: actions/upload-artifact@v5
        with:
          name: bench-${{ matrix.runtime }}-${{ matrix.transport }}
          path: bench-${{ matrix.runtime }}-${{ matrix.transport }}.txt

  criterion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
      - name: Criterion dispatch bench (regression group only)
        # The cell_stress group can deadlock when worker count is
        # comparable to the number of pipeline stages (4): every worker can
        # park inside `ctx.emit` against a full downstream mailbox under
        # the DropNothing policy with no worker left to drain. The CI runner
        # has 2-4 cores, well inside that regime. Filter the cron to the
        # regression group, which is the trend signal we actually care
        # about; cell_stress remains available for local runs.
        run: |
          cargo bench -p flezha_runner --features bench-internals \
            --bench dispatch -- regression_ \
            --save-baseline cron-$(date +%Y%m%d)
      - name: Criterion dynamic-cell steady-state bench
        # Trend signal for the dynamic-mode hot path (lazy per-key routing:
        # cell_key + DashMap lookup). Single operative, 1k active Cells,
        # no eviction — measures routing only, not reaping.
        run: |
          cargo bench -p flezha_runner --features bench-internals \
            --bench dynamic_cell_steady_state -- \
            --save-baseline cron-$(date +%Y%m%d)
      - uses: actions/upload-artifact@v5
        with:
          name: criterion-weekly
          path: target/criterion

  summary:
    needs: [matrix-bench, criterion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: bench-reports
      - name: Post summary (GitHub step summary)
        run: |
          {
            echo "# Weekly bench summary — $(date -u +%Y-%m-%d)"
            echo
            for f in bench-reports/bench-*/*.txt; do
              echo "## $(basename "$(dirname "$f")")"
              echo '```'
              tail -n 20 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
