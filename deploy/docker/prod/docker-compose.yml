# Prod docker-compose for local smoke testing.
# Uses the built prod image — no source bind-mounts.
#
# Usage:
#   VERSION=0.1.0 docker compose -f deploy/docker/prod/docker-compose.yml up
#
# Build the image first:
#   VERSION=0.1.0 make docker-build

services:
  controller:
    image: flezha/flezha:${VERSION:-latest}
    container_name: flezha_agent_prod
    restart: unless-stopped
    # Graceful shutdown: docker sends SIGTERM (default), then waits the
    # grace period before SIGKILL. The 75s budget = coordinator's 60s
    # drain timeout + 15s headroom for finalise + BEAM exit.
    # Bump in lockstep with FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    environment:
      MIX_ENV: prod
      # A prod release refuses to boot with the durability backend unset;
      # `none` is the local-only value this smoke test wants.
      FLEZHA_DURABILITY_BACKEND: ${FLEZHA_DURABILITY_BACKEND:-none}
      # Optional. With no cookie the release mints a node-local one into the
      # state volume and the container comes up operable; set it in .env when
      # this stack has to cluster with anything, because only a value given to
      # every node forms one. There is deliberately no committed default.
      RELEASE_COOKIE: "${RELEASE_COOKIE:-}"
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_SOCKET_FILES_PATH: /flezha/storage/app/sockets/
      FLEZHA_LOG_PATH: /flezha/storage/logs/flezha.log
      FLEZHA_LOG_LEVEL: ${FLEZHA_LOG_LEVEL:-info}
      FLEZHA_GRACEFUL_SHUTDOWN_ENABLED: ${FLEZHA_GRACEFUL_SHUTDOWN_ENABLED:-true}
      FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-60000}
      # Declares the plugin packages this node runs; the entrypoint syncs the
      # flezha_plugins volume to it before starting the controller. While it is
      # set, `flz plugin install` and `uninstall` are refused.
      # FLEZHA_PLUGINS: "https://example.com/flezha_example_plugin-0.1.0.fpz#sha256=<hex>"
    depends_on:
      - kafka
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - flezha_sockets:/flezha/storage/app/sockets
      - flezha_data:/flezha/storage/app/data
      - flezha_certs:/flezha/storage/app/certs
      - flezha_logs:/flezha/storage/logs
      # ProcessHub's persistent registry (auto-restore-on-boot) and
      # per-Cell WAL files. Must survive container restarts.
      - flezha_state:/flezha/storage/app/state
      - flezha_process_hub:/flezha/storage/app/process_hub
      - flezha_plugins:/flezha/storage/app/plugins
    networks:
      - flezha_network

  zookeeper:
    image: zookeeper:3.9.6
    container_name: zookeeper_prod
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flezha_network

  kafka:
    image: confluentinc/cp-kafka:7.8.11
    container_name: kafka_prod
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_prod:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_prod:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - flezha_network

volumes:
  flezha_sockets:
    driver: local
  flezha_data:
    driver: local
  flezha_certs:
    driver: local
  flezha_logs:
    driver: local
  flezha_state:
    driver: local
  flezha_process_hub:
    driver: local
  flezha_plugins:
    driver: local

networks:
  flezha_network:
    driver: bridge
