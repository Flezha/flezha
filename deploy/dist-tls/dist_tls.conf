%% Erlang distribution over mutual TLS. Point FLEZHA_DIST_TLS_OPTFILE at this
%% file on every controller and on the machines that run `flz` against them.
%%
%% /etc/flezha/dist/ holds the folder `make-certs.sh node` writes for this
%% node: its certificate, its key, and the distribution authority's
%% certificate. Use an authority that signs nothing else: any certificate it
%% signs joins the cluster with the cookie.
%%
%% The server side verifies peers only because `verify_peer` says so, and TLS
%% 1.3 is offered only because `versions` says so; leave both in.
[{server, [{certfile, "/etc/flezha/dist/node.pem"},
           {keyfile, "/etc/flezha/dist/node.key"},
           {cacertfile, "/etc/flezha/dist/ca.pem"},
           {verify, verify_peer},
           {fail_if_no_peer_cert, true},
           {versions, ['tlsv1.3']}]},
 {client, [{certfile, "/etc/flezha/dist/node.pem"},
           {keyfile, "/etc/flezha/dist/node.key"},
           {cacertfile, "/etc/flezha/dist/ca.pem"},
           {verify, verify_peer},
           {versions, ['tlsv1.3']}]}].
