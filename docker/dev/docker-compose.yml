services:
  controller:
    # Toolchain image — bundles Elixir+OTP, Rust, Node.js, protoc, etc. so
    # `docker compose up` gives a ready-to-go shell against bind-mounted
    # source. Distinct from `:latest-dev`, which is a runtime image (prod
    # release + Node.js + pre-built testnet) intended for downstream consumers.
    # To rebuild locally without pushing:
    #   docker build -f docker/dev/Dockerfile.toolchain -t alfetahe/flezha:latest-toolchain .
    image: alfetahe/flezha:latest-toolchain
    # TODO: remove the build section later.
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.toolchain
    container_name: flezha_controller_dev
    # Graceful shutdown — see docs/operations/graceful_shutdown.md.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_GRACEFUL_SHUTDOWN_ENABLED: ${FLEZHA_GRACEFUL_SHUTDOWN_ENABLED:-true}
      FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-60000}
    depends_on:
      - kafka
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'beam.smp\\|tail' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Named-volume priming pattern: the Dockerfile build pre-populates these
      # volumes so the bind-mounted source tree doesn't need to be rebuilt from
      # scratch on first `up`. Source changes are reflected immediately via the
      # bind mount (../../:/flezha) — this single bind also covers ProcessHub's
      # persistent registry (`app_data/process_hub/`), per-Segment WAL files
      # (`app_data/state/`), and the plugin install root (`app_data/plugins/`).
      - socket_data:/socket_data
      - ../../:/flezha
      - flezha_build:/flezha/_build
      - flezha_deps:/flezha/deps
      - flezha_cargo_target:/flezha/target
    networks:
      - flezha_network

  zookeeper:
    image: zookeeper:3.9.3
    container_name: flezha_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - flezha_network

  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: flezha_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - flezha_network

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flezha_kafka_ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - flezha_network

  # Sink target for the Postgres plugin integration tests
  # (POSTGRES_INTEGRATION=1 mix test --include postgres_integration).
  # Named `postgres-sink` on host port 5433: the flezha_market dev stack
  # shares the default compose project name ("dev") and already owns a
  # `postgres` service on 5432 — colliding with it recreates that container.
  postgres-sink:
    image: postgres:16
    container_name: flezha_postgres_sink
    environment:
      POSTGRES_USER: flezha
      POSTGRES_PASSWORD: flezha_test
      POSTGRES_DB: flezha_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flezha -d flezha_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flezha_network

  rust:
    # Reuse the toolchain image — it ships with the full Rust toolchain, so
    # the runner app builds in-place from the bind-mounted source.
    # No extra Dockerfile needed for the test container.
    image: alfetahe/flezha:latest-toolchain
    container_name: flezha_rust_runner
    depends_on:
      controller:
        condition: service_started
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      # Demo namespace used by the connection-healing integration test in
      # test/scripts/connection_healing.sh — keep in sync.
      FLEZHA_DEMO_NAMESPACE: ${FLEZHA_DEMO_NAMESPACE:-default}
    working_dir: /flezha/test/apps/rust_runner
    # Wait for the controller's UDS socket to appear, then exec the compute engine.
    # The wait loop tolerates controller restarts: the SDK's own reconnect loop
    # takes over once we've handed off to it.
    command:
      - sh
      - -c
      - |
        until [ -S /flezha/app_data/sockets/runner_control_channel.sock ]; do
          echo "[rust] waiting for controller control socket..."
          sleep 1
        done
        exec cargo run --quiet --manifest-path=/flezha/test/apps/rust_runner/Cargo.toml -- "$$FLEZHA_DEMO_NAMESPACE"
    volumes:
      - socket_data:/socket_data
      - ../../:/flezha
      - flezha_cargo_target:/flezha/target
    networks:
      - flezha_network

volumes:
  socket_data:
    driver: local
  flezha_build:
    driver: local
  flezha_deps:
    driver: local
  flezha_cargo_target:
    driver: local

networks:
  flezha_network:
    external: true
