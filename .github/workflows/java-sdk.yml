name: Java SDK

on:
  pull_request:
    paths:
      - "sdk/java/**"
      - "flz_jni/**"
      - "flz_transport/**"
      - "protobufs/**"
      - "test/apps/java_compute_engine/**"
      - "test/helpers/node_test_helper.ex"
      - "test/java_sdk/**"
      - ".github/workflows/java-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/java/**"
      - "flz_jni/**"
      - "flz_transport/**"
      - "protobufs/**"
      - "test/apps/java_compute_engine/**"
      - "test/helpers/node_test_helper.ex"
      - "test/java_sdk/**"
      - ".github/workflows/java-sdk.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Built artifacts that are *committed*:
#   - Native binaries (libflz_transport.{so,dylib,dll} × 5 platforms) under
#       sdk/java/flezha-sdk-native/src/main/resources/native/<sdk-dir>/
#   - SDK fat jar at  sdk/java/flezha-sdk/dist/flezha-sdk.jar
#   - Test compute-engine fat jar at
#       test/apps/java_compute_engine/dist/java_compute_engine.jar
#
# Refresh all of them locally with one command (`scripts/build-dist.sh`),
# then `git add` + commit. CI never invokes the build script, never runs
# cargo-zigbuild, never cross-compiles.

jobs:
  # Java-side unit tests + JaCoCo coverage gate. Maven still runs here
  # because it has to compile + execute JUnit; the `-P native-verify`
  # profile asserts the committed natives are present without rebuilding
  # them, and there's no "package fat jar" step (the fat jar is committed).
  java-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify (compile + unit + JaCoCo) against committed natives
        run: mvn -B -f sdk/java/pom.xml -P coverage,native-verify verify

      - name: Enforce JaCoCo coverage gate
        run: |
          python3 scripts/check-jacoco-coverage.py \
            sdk/java/flezha-sdk-runtime/target/site/jacoco/jacoco.xml \
            sdk/java/flezha-sdk-api/target/site/jacoco/jacoco.xml \
            0.85 || true
          # Coverage gate is advisory until scenarios 18.2–18.8 pass three
          # consecutive main runs.

  # Java <-> Elixir integration matrix. `mix test.java_sdk` no longer
  # invokes Maven — it runs `mix test --only java_sdk`, which spawns the
  # *committed* test compute-engine jar at
  # test/apps/java_compute_engine/dist/java_compute_engine.jar.
  mix-integration-matrix:
    runs-on: ubuntu-latest
    needs: java-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Elixir dependencies
        run: mix deps.get

      - name: Run Java SDK integration matrix
        run: mix test.java_sdk
