[package]
name = "flz_transport"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Flezha shared transport library — QUIC, UDS, binary framing"

[lib]
name = "flz_transport"
crate-type = ["rlib"]

[dependencies]
byteorder = "1.4"
crossbeam = "0.8"
mio = { version = "0.8.11", features = ["os-poll", "os-ext", "net"] }
quinn-proto = "0.11"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Already in the graph via mio; the direct dependency is one call, `getuid`,
# for the access-denied diagnosis.
libc = "0.2"

[lints]
workspace = true
