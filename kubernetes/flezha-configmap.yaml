apiVersion: v1
kind: ConfigMap
metadata:
  name: flezha-config
  namespace: flezha
  labels:
    app.kubernetes.io/name: flezha
    app.kubernetes.io/instance: flezha
    app.kubernetes.io/part-of: flezha
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: controller
data:
  # A prod release refuses to boot with this unset. `none` is local-only;
  # see operations/deployment/variables.md before changing it.
  FLEZHA_DURABILITY_BACKEND: "none"
  FLEZHA_TRANSPORT: "uds"
  FLEZHA_CLUSTER_DISCOVERY: "k8s_pod_discovery"
  FLEZHA_K8S_IP_LOOKUP_MODE: "pods"
  FLEZHA_K8S_MASTER_NAME: "kubernetes.default.svc"
  FLEZHA_K8S_MASTER_PORT: "443"
  FLEZHA_RECONNECT_INTERVAL: "2000"
  FLEZHA_MAX_RECONNECTS: "10"
  FLEZHA_RUNNER_KEEPALIVE: "30000"
  # The address the controller LISTENS on. A runner's dial list is
  # FLEZHA_QUIC_ADDRESSES, set per runner pod.
  FLEZHA_QUIC_LISTEN_ADDRESS: "0.0.0.0:4433"
  FLEZHA_CA_CERT_PATH: "/flezha/app_data/certs/ca.pem"
  FLEZHA_SERVER_CERT_PATH: "/flezha/app_data/certs/server.pem"
  FLEZHA_SERVER_KEY_PATH: "/flezha/app_data/certs/server.key"
  FLEZHA_LOG_PATH: "/var/log/flezha/flezha.log"
  # auto-restore-on-boot. ProcessHub's persistent registry lives under
  # FLEZHA_PROCESS_HUB_REGISTRY_ROOT, which must be mounted from
  # persistent storage (see flezha-daemonset.yaml).
  FLEZHA_AUTO_RESTORE_ENABLED: "true"
  FLEZHA_RECOVERY_WINDOW_MS: "10000"
  FLEZHA_BOOT_REPLAY_TIMEOUT_MS: "60000"
  FLEZHA_PRE_REPLAY_FLEET_WAIT_MS: "30000"
  FLEZHA_WAL_TRANSFER_QUERY_TIMEOUT_MS: "5000"
  FLEZHA_PROCESS_HUB_REGISTRY_ROOT: "/var/lib/flezha/process_hub"
  # Every durable path must live on the mounted volume. These default to
  # `app_data/*` relative to the image's working dir, which under
  # `readOnlyRootFilesystem: true` is unwritable — and, before that, was
  # merely ephemeral: state written there was silently lost on every restart.
  FLEZHA_STATE_DIR: "/var/lib/flezha/state"
  FLEZHA_DLQ_DIR: "/var/lib/flezha/dlq"
  # Health endpoint backing the DaemonSet's startup/liveness/readiness probes.
  # Must bind 0.0.0.0: the kubelet probes the pod IP, not loopback.
  FLEZHA_HEALTHZ_ENABLED: "true"
  FLEZHA_HEALTHZ_PORT: "9569"
  FLEZHA_HEALTHZ_BIND: "0.0.0.0"
  # Graceful shutdown (controller-graceful-shutdown).
  # MUST stay paired with `terminationGracePeriodSeconds` in the
  # DaemonSet (timeout_ms / 1000 + 15s headroom). Bumping this value
  # without bumping the grace period will cause SIGKILLs mid-drain.
  FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: "60000"
