version = 1
SPDX-PackageName = "Flezha"
SPDX-PackageSupplier = "Anuar Alfetahe"
SPDX-PackageDownloadLocation = "https://github.com/flezha/flezha"

# Default: the controller, CLI, NIF, tests, docs and operations tooling.
[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "2026 Anuar Alfetahe"
SPDX-License-Identifier = "MPL-2.0"

# The SDK side, the wire contract every SDK implements, and the examples. A
# later table wins for its paths. The plugins under plugins/ are submodules
# that carry their own Apache-2.0 license.
[[annotations]]
path = [
  "sdk/**",
  "flz_core/**",
  "flz_core_ffi/**",
  "flz_transport/**",
  "protobufs/**",
  # Examples are meant to be copied into a user's own project, so they carry
  # the SDK's licence rather than the controller's.
  "examples/**",
]
SPDX-FileCopyrightText = "2026 Anuar Alfetahe"
SPDX-License-Identifier = "Apache-2.0"
