# Reference template for an executor service (an SDK process that attaches to
# the Flezha controller over the shared Unix socket dir). Copy, rename, and
# replace the `executor-service-x` placeholders and the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-service-x
  namespace: flezha
  labels:
    app: executor-service-x
    app.kubernetes.io/name: executor-service-x
    app.kubernetes.io/instance: executor-service-x
    app.kubernetes.io/component: executor
    app.kubernetes.io/part-of: flezha
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3 # X replicas - will distribute across available nodes
  selector:
    matchLabels:
      app: executor-service-x
  template:
    metadata:
      labels:
        app: executor-service-x
        app.kubernetes.io/name: executor-service-x
        app.kubernetes.io/instance: executor-service-x
        app.kubernetes.io/component: executor
        app.kubernetes.io/part-of: flezha
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Only needed for a private registry.
      #
      # imagePullSecrets:
      #   - name: dockerhub-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - executor-service-x
                topologyKey: kubernetes.io/hostname
      containers:
        - name: executor-service-x
          # Pin a released tag; never `:latest` (see README "Image and registry").
          image: your-executor-service-x:0.1.0
          # Starting points — tune to the executor's workload.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # An executor exposes no health endpoint of its own. The liveness
          # signal it does have is its attachment to the controller: the SDK
          # only creates its primary-stream socket once the control channel is
          # up. Replace this with an HTTP probe if your service serves one.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ls /shared/sockets/primary_stream_* >/dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ls /shared/sockets/primary_stream_* >/dev/null 2>&1
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: flezha-sockets
              mountPath: /shared/sockets # Access to Flezha's Unix sockets
            - name: executor-service-x-data
              mountPath: /app/data
            # readOnlyRootFilesystem: true — give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
          env:
            - name: FLEZHA_SOCKET_FILES_PATH
              value: "/shared/sockets"
      volumes:
        - name: flezha-sockets
          hostPath:
            path: /opt/flezha-sockets # Same path as Flezha DaemonSet
            type: Directory
        - name: executor-service-x-data
          hostPath:
            path: /opt/executor-service-x-data
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
