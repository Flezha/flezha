apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-engine-service-x
  namespace: flezha
spec:
  replicas: 3 # X replicas - will distribute across available nodes
  selector:
    matchLabels:
      app: compute-engine-service-x
  template:
    metadata:
      labels:
        app: compute-engine-service-x
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      compute_engine: In
                      values:
                        - compute-engine-service-x
                topologyKey: kubernetes.io/hostname
      containers:
        - name: compute-engine-service-x
          image: your-compute-engine-service-x:latest
          volumeMounts:
            - name: flezha-sockets
              mountPath: /shared/sockets # Access to Flezha's Unix sockets
            - name: compute-engine-service-x-data
              mountPath: /app/data
          env:
            - name: FLEZHA_SOCKET_FILES_PATH
              value: "/shared/sockets"
      volumes:
        - name: flezha-sockets
          hostPath:
            path: /opt/flezha-sockets # Same path as Flezha DaemonSet
            type: Directory
        - name: compute-engine-service-x-data
          hostPath:
            path: /opt/compute-engine-service-x-data
            type: DirectoryOrCreate
