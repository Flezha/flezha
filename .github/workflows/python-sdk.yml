name: Python SDK

# What this repository still owns for Python. The package's own suite on every
# supported interpreter, its type checks, both wheel tiers and the source
# distribution live in `flezha/flezha_python_sdk` now, where the package is
# developed; `sdk/python` here is that repository as a submodule, pinned to a
# commit. What cannot move is end to end, which needs the controller.
#
# A change to the SDK reaches this job when the pin is bumped, which is the
# change that brings it into end to end at all.

on:
  pull_request:
    paths:
      - "sdk/python"
      - "flz_core/**"
      - "flz_core_ffi/**"
      - "flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-python-sdk.sh"
      - ".github/workflows/python-sdk.yml"
      - "scripts/gate_rows.py"
  push:
    branches: [main]
    paths:
      - "sdk/python"
      - "flz_core/**"
      - "flz_core_ffi/**"
      - "flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-python-sdk.sh"
      - ".github/workflows/python-sdk.yml"
      - "scripts/gate_rows.py"

env:
  CARGO_TERM_COLOR: always

jobs:
  # End to end, which is the half an SDK repository cannot run: it needs the
  # controller. The submodule is what this job runs the Python runtime from, at
  # the commit this tree pins.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - uses: ./.github/actions/sdk-smoke
        with:
          runtime: python
