name: Node SDK

# What this repository still owns for Node. The package's own suite, its
# per-platform binaries and its publish live in `flezha/flezha_node_sdk` now,
# where the package is developed; `sdk/node` here is that repository as a
# submodule, pinned to a commit. What cannot move is on this side of the pin:
# the veneer is a feature of this repository's own crate, and end to end needs
# the controller.
#
# A change to the SDK reaches these jobs when the pin is bumped, which is the
# change that brings it into end to end at all.

on:
  pull_request:
    paths:
      - "sdk/node"
      - "examples/node/**"
      - "flz_core/**"
      - "flz_core_ffi/**"
      - "flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-node-sdk.sh"
      - ".github/workflows/node-sdk.yml"
      - "scripts/gate_rows.py"
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The veneer is a feature of this repository's `flz_core_ffi`, never a crate
  # of its own, so its ABI scenario stays here whatever repository the package
  # is developed in.
  veneer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: The ABI scenario, driven through the Node veneer
        run: python3 scripts/naming_gate.py --run rust-test-ffi-napi

      - name: The feature is additive
        # Enabling `napi` adds one exported symbol and removes none, and the
        # JNI exports are untouched when both features are on. Asserted rather
        # than reviewed, because the Java SDK ships a binary built from this
        # crate. The same assertion holds for every veneer feature, so the
        # script is the one place that spells it.
        run: scripts/check-feature-symbols.sh _build/.target/debug/libflz_core_ffi.so napi

  # End to end, which is the half an SDK repository cannot run: it needs the
  # controller. The submodule is what this job runs the Node runtime from, at
  # the commit this tree pins.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - uses: ./.github/actions/sdk-smoke
        with:
          runtime: node
