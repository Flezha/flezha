[package]
name = "flz"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository.workspace = true
publish = false

[dependencies]
serde_json = "1.0"
# `flz runner check` runs the runner's own probe, not a second copy of it.
flz_transport = { path = "../flz_transport" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "flz"
path = "src/main.rs"