apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flezha-daemonset
  namespace: flezha
spec:
  selector:
    matchLabels:
      app: flezha
  template:
    metadata:
      labels:
        app: flezha
    spec:
      serviceAccountName: flezha-reader
      imagePullSecrets:
        - name: dockerhub-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.35
          command: ['sh', '-c', 'chown -R 1000:1000 /flezha/sockets /flezha/data /var/log/flezha && chmod -R 755 /flezha/sockets /flezha/data /var/log/flezha']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: flezha-sockets
              mountPath: /flezha/sockets
            - name: flezha-data
              mountPath: /flezha/data
            - name: flezha-logs
              mountPath: /var/log/flezha
      containers:
        - name: flezha
          image: alfetahe/flezha:0.1.6
          ports:
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            - name: FLEZHA_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLEZHA_CLUSTER_DISCOVERY            
              value: "k8s_pod_discovery"
            - name: FLEZHA_RECONNECT_INTERVAL
              value: "2"
            - name: FLEZHA_MAX_RECONNECTS
              value: "10"
            - name: FLEZHA_NODE_NAME
              value: "flezha"
            - name: FLEZHA_K8S_IP_LOOKUP_MODE
              value: "pods"
            - name: FLEZHA_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLEZHA_K8S_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: FLEZHA_K8S_SELECTOR
              value: "app=flezha"
            - name: FLEZHA_K8S_MASTER_NAME
              value: "kubernetes.default.svc"
            - name: FLEZHA_K8S_MASTER_PORT
              value: "443"
            - name: FLEZHA_SOCKET_FILES_PATH
              value: "/flezha/sockets"
            - name: FLEZHA_LOG_PATH
              value: "/var/log/flezha/flezha.log"
          volumeMounts:
            - name: flezha-sockets
              mountPath: /flezha/sockets
            - name: flezha-data
              mountPath: /flezha/data
            - name: flezha-logs
              mountPath: /var/log/flezha
      volumes:
        - name: flezha-sockets
          hostPath:
            path: /opt/flezha-sockets
            type: DirectoryOrCreate
        - name: flezha-data
          hostPath:
            path: /opt/flezha-data
            type: DirectoryOrCreate
        - name: flezha-logs
          hostPath:
            path: /opt/flezha-logs
            type: DirectoryOrCreate
