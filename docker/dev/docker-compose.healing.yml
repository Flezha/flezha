services:
  controller:
    image: flezha/flezha:latest-toolchain
    container_name: flezha_controller_dev
    user: "${FLEZHA_CONTAINER_USER:-1000:1000}"
    working_dir: /flezha
    stdin_open: true
    # Graceful shutdown — see docs/operations/graceful_shutdown.md.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    # Auto-start the BEAM so the connection_healing test (or any future
    # automated probe) does not need to exec `mix run` after `docker compose
    # up`. harness-boot.sh guards the mounted paths and the deps fetch, then
    # execs the BEAM in place — so the BEAM is PID 1 and its graceful drain
    # receives SIGTERM directly.
    command:
      - /flezha/scripts/harness-boot.sh
      - mix
      - run
      - --no-halt
    environment:
      MIX_ENV: dev
      # Container-local build/deps paths: the host may have compiled the
      # bind-mounted _build/ and deps/ with a different Elixir, and mixing
      # the two triggers `corrupt atom table` failures inside the container.
      MIX_BUILD_PATH: /home/flezha/_build/dev
      MIX_DEPS_PATH: /home/flezha/deps
      FLEZHA_HARNESS_PATHS: /home/flezha/_build /home/flezha/deps /flezha/app_data/sockets
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_GRACEFUL_SHUTDOWN_ENABLED: ${FLEZHA_GRACEFUL_SHUTDOWN_ENABLED:-true}
      FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${FLEZHA_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-60000}
      HOME: /home/flezha
      CARGO_HOME: /home/flezha/.cargo
      RUSTUP_HOME: /home/flezha/.rustup
      PATH: /home/flezha/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /flezha/app_data/sockets/runner_control_channel.sock
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    # Direct bind mount only — DO NOT pull in the parent compose's named
    # volumes for /flezha/_build, /flezha/deps, /flezha/target. Those start
    # empty, defeating the host's existing build cache and forcing every run
    # to recompile from scratch (8+ min). With the bind mount alone, compile
    # artifacts persist on the host across runs.
    volumes:
      - ../../:/flezha
    networks:
      - flezha_network

  rust:
    image: flezha/flezha:latest-toolchain
    container_name: flezha_rust_runner
    user: "${FLEZHA_CONTAINER_USER:-1000:1000}"
    stdin_open: true
    depends_on:
      controller:
        condition: service_healthy
    command:
      - /flezha/scripts/harness-boot.sh
      - sh
      - -c
      - |
        ns="$$FLEZHA_DEMO_NAMESPACE"
        : "$${ns:=default}"
        echo "[rust] starting compute engine for namespace=$$ns"
        exec cargo run --quiet --manifest-path=/flezha/test/apps/rust_runner/Cargo.toml --target-dir=/flezha/target -- "$$ns"
    environment:
      FLEZHA_DEMO_NAMESPACE: ${FLEZHA_DEMO_NAMESPACE:-default}
      FLEZHA_HARNESS_PATHS: /flezha/target /flezha/app_data
      FLEZHA_HARNESS_WAIT_SOCKET: /flezha/app_data/sockets/runner_control_channel.sock
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      HOME: /home/flezha
      CARGO_HOME: /home/flezha/.cargo
      RUSTUP_HOME: /home/flezha/.rustup
      PATH: /home/flezha/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ../../:/flezha
    networks:
      - flezha_network

networks:
  flezha_network:
    external: true
