name: Ruby SDK

# What this repository still owns for Ruby. The gem's own suite on every
# supported Ruby, its source gem and the precompiled platform gems' recipe live
# in `flezha/flezha_ruby_sdk` now, where the gem is developed; `sdk/ruby` here is
# that repository as a submodule, pinned to a commit. What cannot move is on
# this side of the pin: the veneer is a feature of this repository's own crate,
# and end to end needs the controller. The platform gems a release publishes are
# built by the release job in `java-sdk.yml`.
#
# A change to the gem reaches these jobs when the pin is bumped, which is the
# change that brings it into end to end at all.

on:
  pull_request:
    paths:
      - "sdk/ruby"
      - "crates/flz_core/**"
      - "crates/flz_core_ffi/**"
      - "crates/flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-ruby-sdk.sh"
      - ".github/workflows/ruby-sdk.yml"
      - "scripts/gate_rows.py"
  push:
    branches: [main]
    paths:
      - "sdk/ruby"
      - "crates/flz_core/**"
      - "crates/flz_core_ffi/**"
      - "crates/flz_transport/**"
      - "test/fixtures/host_class_decl_keys.txt"
      - "scripts/build-ruby-sdk.sh"
      - ".github/workflows/ruby-sdk.yml"
      - "scripts/gate_rows.py"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The veneer, from the Rust side. `--features ruby` must stay additive: the
  # crate's other artifacts and the Java and Node veneers are built from the
  # same source.
  veneer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/setup-ruby

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install libclang and its builtin headers
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # The full ABI scenario, mapped through the Ruby veneer on an embedded
      # CRuby VM, with no Ruby process involved; then the crate with no veneer,
      # the point of the feature gate: a machine with no Ruby, no JVM and no
      # Node still builds it.
      - name: The ABI scenario through the Ruby veneer, and the crate without one
        run: python3 scripts/run_gates.py --run rust-test-ffi-ruby,rust-build-ffi

      - name: The feature is additive
        # Enabling `ruby` adds the extension's module registration and removes
        # nothing, and the JNI exports are untouched when both features are on.
        # Asserted rather than reviewed, because the Java SDK ships a binary
        # built from this crate. The same assertion holds for every veneer
        # feature, so the script is the one place that spells it.
        run: scripts/check-feature-symbols.sh _build/.target/debug/libflz_core_ffi.so ruby

  # End to end, which is the half the gem's repository cannot run: it needs the
  # controller. The submodule is what this job runs the Ruby runtime from, at the
  # commit this tree pins.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/setup-ruby

      # rb-sys runs bindgen over `ruby.h`, and bindgen needs clang's own
      # builtin headers.
      - name: Install libclang and its builtin headers
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: ./.github/actions/sdk-smoke
        with:
          runtime: ruby
