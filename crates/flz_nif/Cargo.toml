[package]
name = "flz_nif"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish = false
description = "Rustler NIF wrapping flz_transport for the Elixir controller"

[lib]
name = "flz_nif"
crate-type = ["cdylib"]

[dependencies]
flz_transport = { path = "../flz_transport" }
rustler = "0.38"
crossbeam.workspace = true
libc.workspace = true
mio.workspace = true
quinn-proto.workspace = true
bytes.workspace = true
rustls.workspace = true

[dev-dependencies]
flz_transport = { path = "../flz_transport", features = ["test-support"] }

[lints]
workspace = true
