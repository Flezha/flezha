# Prod docker-compose for local smoke testing.
# Uses the built prod image — no source bind-mounts.
#
# Usage:
#   VERSION=0.2.0 docker compose -f docker/prod/docker-compose.yml up
#
# Build the image first:
#   VERSION=0.2.0 make docker-build

services:
  agent:
    image: alfetahe/flezha:${VERSION:-latest}
    container_name: flezha_agent_prod
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      FLEZHA_TRANSPORT: ${FLEZHA_TRANSPORT:-uds}
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
      FLEZHA_LOG_PATH: /flezha/app_data/logs/flezha.log
      FLEZHA_LOG_LEVEL: ${FLEZHA_LOG_LEVEL:-info}
      # Failure-recovery subsystem. Override FLEZHA_DATA_DIR in your .env
      # file if you want the DETS file somewhere other than the named volume.
      FLEZHA_RECOVERY_ENABLED: ${FLEZHA_RECOVERY_ENABLED:-true}
      FLEZHA_RECOVERY_WINDOW_MS: ${FLEZHA_RECOVERY_WINDOW_MS:-10000}
      # Kept under /flezha/app_data/ so the non-root `flezha` user (uid 1000)
      # that the image runs as owns the mountpoint's parent. A path outside
      # this tree (e.g. /var/lib/flezha) would be root-owned inside the
      # volume and Store init would fail with EACCES.
      FLEZHA_DATA_DIR: /flezha/app_data/recovery
    depends_on:
      - kafka
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - flezha_sockets:/flezha/app_data/sockets
      - flezha_data:/flezha/app_data/data
      - flezha_certs:/flezha/app_data/certs
      - flezha_logs:/flezha/app_data/logs
      - flezha_recovery:/flezha/app_data/recovery
    networks:
      - flezha_network

  zookeeper:
    image: zookeeper:3.9.3
    container_name: zookeeper_prod
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flezha_network

  kafka:
    image: confluentinc/cp-kafka:7.8.6
    container_name: kafka_prod
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_prod:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_prod:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - flezha_network

volumes:
  flezha_sockets:
    driver: local
  flezha_data:
    driver: local
  flezha_certs:
    driver: local
  flezha_logs:
    driver: local
  flezha_recovery:
    driver: local

networks:
  flezha_network:
    driver: bridge
