name: Format

# Source-shape gate. Installs every toolchain the formatters need, then calls
# the gate runner once for the `format` group: every formatter in check mode,
# `reuse lint` (the per-path license map) and a freshness diff of the generated
# THIRD_PARTY_NOTICES.md. Failure blocks merge. Locally the same call is
# `python3 scripts/naming_gate.py --run @format`; auto-fix with
# `scripts/format-apply.sh`.
#
# CI keeps no list of its own, of formatters or of checks. Two lists drift: for
# a long time this workflow ran spotless and nothing else, so prettier, ruff,
# rubocop and php-cs-fixer had never executed in CI at all while a second local
# script claimed to cover them.

on:
  # An ignore-list, not an allow-list. The gate covers seven languages across
  # the whole tree, and an allow-list that forgets one of them is a gate that
  # silently stops covering it. Prose is the only thing exempt.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Nightly rustfmt is required because rustfmt.toml uses
      # `imports_granularity`, `group_imports`, and `ignore` — all
      # nightly-only. The date is pinned in .github/toolchains.json; bump it
      # there alongside rustfmt.toml and the same pin in
      # scripts/format-apply.sh. No cargo cache: nothing here compiles.
      - name: Install Rust nightly (rustfmt)
        uses: ./.github/actions/setup-rust
        with:
          channel: nightly
          components: rustfmt
          cache: "false"

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          cache: maven

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby

      - name: Set up PHP
        uses: ./.github/actions/setup-php

      # Each veneer formatter is that SDK's own pinned development dependency,
      # and every version comes out of the SDK's manifest rather than being
      # written a second time here. None of these builds the native library:
      # the formatters are pure tooling.
      #
      # `continue-on-error` on all four for the same reason the script collects
      # instead of aborting — an install that fails must cost one language, not
      # the whole report. The check step below still fails the job, and it says
      # which formatter it could not find and that the others are clean.
      - name: Install prettier (sdk/node)
        continue-on-error: true
        working-directory: sdk/node
        run: npm ci

      - name: Install ruff (sdk/python)
        continue-on-error: true
        run: pip install "ruff==$(scripts/manifest_pin.sh sdk/python/pyproject.toml ruff)"

      - name: Install rubocop (sdk/ruby)
        continue-on-error: true
        run: |
          gem install --no-document rubocop \
            -v "$(scripts/manifest_pin.sh sdk/ruby/flezha.gemspec rubocop)"

      - name: Install php-cs-fixer (sdk/php)
        continue-on-error: true
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress

      - name: Install reuse
        run: pip install reuse

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # One step, and CI keeps no list of its own. The three checks are rows in
      # the gate runner: the formatter driver (which covers Rust, Elixir, Java,
      # Node, Python, Ruby and PHP and prints a `==>` line per language), the
      # per-path licence lint, and the freshness diff of the generated notices.
      # If an install step above ever stops working, the runner names the tool
      # it could not find, still reports every other check, and ends non-zero
      # instead of dropping one silently.
      - name: The source-shape gates
        run: python3 scripts/naming_gate.py --run @format
