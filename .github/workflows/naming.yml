name: Naming

# Repo-wide naming + boundary gates. The two operative kinds are `stream` and
# `workflow`; check-kind-naming fails a PR that reintroduces `bounded`/`unbounded`
# as a kind name. check-sdk-boundary keeps lib/flezha/sdk/ touching the controller
# only through the named packaging seams (prepares `package-elixir-sdk`).
# Deliberately unfiltered by path — the invariant covers docs and specs as much
# as code — and toolchain-free, so it costs nothing next to the Format gate.
# Local equivalent: `scripts/check-kind-naming.sh`.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kind-naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check-kind-naming
        run: scripts/check-kind-naming.sh
      - name: check-sdk-boundary
        run: scripts/check-sdk-boundary.sh
