name: Run an SDK's smoke tier end to end
description: >
  The SDK's gates from the one gate list, among them the half of its testing
  its own repository cannot run: the shared smoke tier against the controller,
  with the SDK taken from its submodule at the commit this tree pins. The job
  checks out with submodules and sets up the SDK's own language first.

inputs:
  runtime:
    description: >
      The runtime whose `@sdk-<runtime>` rows run; its runner is built by its
      conformance manifest's `build.test` command, as the first of them.
    required: true
  testnet:
    description: Build the WebSocket testnet bundle first (`true` or `false`).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Erlang and Elixir
      uses: ./.github/actions/setup-beam

    - name: Install Rust
      uses: ./.github/actions/setup-rust

    - name: Install protoc
      uses: ./.github/actions/setup-protoc

    - name: Compile the third-party dependencies
      shell: bash
      run: python3 scripts/run_gates.py --run @deps

    - name: Build the testnet bundle
      if: inputs.testnet == 'true'
      shell: bash
      run: python3 scripts/run_gates.py --run core-testnet

    - name: The SDK's gates and the shared smoke tier
      # The reference runner every case boots, the fake controller the SDK's
      # own smoke runs against, then the rows of `@sdk-<runtime>` in
      # scripts/gate_rows.py.
      shell: bash
      run: |
        python3 scripts/run_gates.py \
          --run core-prep-runner,sdk-fake-controller,@sdk-${{ inputs.runtime }}
