name: Naming

# Repo-wide naming + boundary gates. The two operative kinds are `stream` and
# `workflow`; check-kind-naming fails a PR that reintroduces `bounded`/`unbounded`
# as a kind name. The three overflow policies are `DropNothing`/`DropNewest`/
# `DropOldest`; check-overflow-naming fails a PR that reintroduces `Block` as a
# policy name. check-module-naming fails a PR that reintroduces one of the seven
# module paths retired for naming the wrong thing (the script lists them with
# their replacements). check-sdk-boundary keeps lib/flezha/sdk/ touching the
# controller only through the named packaging seams (prepares
# `package-elixir-sdk`).
# Deliberately unfiltered by path — the invariants cover docs and specs as much
# as code — and toolchain-free, so it costs nothing next to the Format gate.
# Local equivalents: the `scripts/check-*.sh` invoked below.
#
# check-mimic-global is the one path-scoped gate here: it reads `test/` only,
# because the call it refuses has no place in `lib/` at all. Mimic's global
# mode is process-group state, so a module that sets it without releasing it
# fails every stub in whichever module ExUnit happens to run next (KI-43).
# `test/helpers/mimic_global.ex` defines the releasing wrapper and is the one
# exemption, declared by path.
#
# The five gates share one walk (scripts/naming_gate.py), whose recorded-history
# escape hatch decides which lines each gate reads. Its self-test proves that
# escape scopes to its own block: it runs the walk over a throwaway git tree
# where a whole record on one line, a two-line block and a block left open each
# have a known answer. A gate that says OK because it stopped reading is
# indistinguishable from one that says OK because the tree is clean.
#
# check-build-artifacts is the repository-weight gate: `tracked` refuses a
# committed build artefact (native libraries and fat jars are build output —
# `scripts/build-native.sh` produces the one triple a test needs, and a release
# publishes all five), and `size` holds the packed repository under 150 MB.
# `size` needs the whole history, so its job checks out with fetch-depth 0. It is
# blocking: the purge reclaimed 961 MB -> 15 MB, and the ceiling is what keeps
# it there (docs/runbooks/purge-build-artifacts.md).
#
# refactor-metrics is the structure ratchet (docs/refactor/charter.md §11):
# non-blocking until an area is listed under `blocking` in
# docs/refactor/baseline.json, and it uploads the measured JSON either way.
# It needs only jscpd from sdk/node; the Elixir cycle count and the lint counts
# are skipped without their toolchains and compared only when both sides have them.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kind-naming:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check-kind-naming
        run: scripts/check-kind-naming.sh
      - name: check-overflow-naming
        run: scripts/check-overflow-naming.sh
      - name: check-module-naming
        run: scripts/check-module-naming.sh
      - name: check-sdk-boundary
        run: scripts/check-sdk-boundary.sh
      - name: check-mimic-global
        run: scripts/check-mimic-global.sh
      - name: naming_gate self-test
        run: python3 scripts/naming_gate.py --self-test

  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: check-build-artifacts tracked
        run: scripts/check-build-artifacts.sh tracked

  repo-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check-build-artifacts size
        run: scripts/check-build-artifacts.sh size

  refactor-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jscpd (pinned in sdk/node/package.json)
        run: npm ci --prefix sdk/node --ignore-scripts
      - name: refactor_metrics --check
        run: python3 scripts/refactor_metrics.py --check
      - name: Measure
        if: always()
        run: python3 scripts/refactor_metrics.py --json > refactor-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-metrics
          path: refactor-metrics.json
