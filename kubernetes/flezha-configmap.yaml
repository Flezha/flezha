apiVersion: v1
kind: ConfigMap
metadata:
  name: flezha-config
  namespace: flezha
data:
  FLEZHA_TRANSPORT: "uds"
  FLEZHA_CLUSTER_DISCOVERY: "k8s_pod_discovery"
  FLEZHA_K8S_IP_LOOKUP_MODE: "pods"
  FLEZHA_K8S_MASTER_NAME: "kubernetes.default.svc"
  FLEZHA_K8S_MASTER_PORT: "443"
  FLEZHA_RECONNECT_INTERVAL: "2000"
  FLEZHA_MAX_RECONNECTS: "10"
  FLEZHA_EXECUTOR_KEEPALIVE: "30000"
  FLEZHA_QUIC_ADDRESS: "0.0.0.0:4433"
  FLEZHA_CA_CERT_PATH: "/flezha/app_data/certs/ca.pem"
  FLEZHA_SERVER_CERT_PATH: "/flezha/app_data/certs/server.pem"
  FLEZHA_SERVER_KEY_PATH: "/flezha/app_data/certs/server.key"
  FLEZHA_LOG_PATH: "/var/log/flezha/flezha.log"
  # auto-restore-on-boot. ProcessHub's persistent registry lives under
  # FLEZHA_PROCESS_HUB_REGISTRY_ROOT, which must be mounted from
  # persistent storage (see flezha-daemonset.yaml).
  FLEZHA_AUTO_RESTORE_ENABLED: "true"
  FLEZHA_RECOVERY_WINDOW_MS: "10000"
  FLEZHA_BOOT_REPLAY_TIMEOUT_MS: "60000"
  FLEZHA_PRE_REPLAY_FLEET_WAIT_MS: "30000"
  FLEZHA_WAL_TRANSFER_QUERY_TIMEOUT_MS: "5000"
  FLEZHA_PROCESS_HUB_REGISTRY_ROOT: "/var/lib/flezha/process_hub"
  FLEZHA_DATA_DIR: "/var/lib/flezha"
