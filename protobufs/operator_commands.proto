syntax = "proto3";


package operator_commands;

message CommandRequest {
    string reference_id = 1;
    
    oneof command {
        AssignOperatorId assign_operator_id = 2;
        ConnectSocket connect_socket = 3;
        AddPipeline add_pipeline = 4;
        RemPipeline rem_pipeline = 5;
        MigrationSerialization migration_serialization = 6;
        MigrationDeserialization migration_deserialization = 7;
        PipelineState pipeline_state = 8;
        OperatorDisconnect operator_disconnect = 9;
    }
}

message CommandResponse {
    string reference_id = 1;
    string status = 2;
    repeated string errors = 3;
    bytes raw_data = 4;
}

message AssignOperatorId {
    string operator_id = 1;
}

message ConnectSocket {
    uint32 sockets_count = 1;
}

message AddPipeline {
    string pipeline_id = 1;
    string factory_id = 2;
    string init_values = 3;
}

message RemPipeline {
    string pipeline_id = 1;
}

message MigrationSerialization {
    string pipeline_id = 1;
}

message MigrationDeserialization {
    string pipeline_id = 1;
    string factory_id = 2;
    bytes serialized_state = 3;
}

message PipelineState {
    string pipeline_id = 1;
}

message OperatorDisconnect {}