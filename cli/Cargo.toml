[package]
name = "flz"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `flz runner check` runs the runner's own probe, not a second copy of it.
flz_transport = { path = "../flz_transport" }
# The OS entropy source, for the one value this crate mints: the break-glass
# bootstrap token. `flz_transport::utility::noise` is deliberately not
# cryptographic and must not be used for a credential.
getrandom = "0.2"
# Already in the graph via flz_transport; the direct dependency is the signal
# handler `flz mcp` stops its children on, and the parent-death signal that
# kills a `flzvm` child when `flz` itself is killed.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "flz"
path = "src/main.rs"

[lints]
workspace = true
