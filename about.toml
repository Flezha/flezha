# cargo-about: the attribution that travels with every binary that statically
# links the Rust dependency tree (libflz_core_ffi.*, flz_nif.so, flz).
# Order matters for disjunctive expressions: the first listed license that
# satisfies the crate's expression is the one attributed.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-gnu",
]

[private]
ignore = true
