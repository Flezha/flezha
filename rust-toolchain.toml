# Project default Rust toolchain. Stable matches what every existing CI
# workflow installs via `dtolnay/rust-toolchain@stable`, so adding this
# file is a no-op for those jobs.
#
# The format-check job in `.github/workflows/format.yml` deliberately
# installs nightly-2026-05-07 instead, because the rustfmt opinions in
# `rustfmt.toml` (`imports_granularity`, `group_imports`, `ignore`) are
# nightly-rustfmt-only. Bump that pinned nightly together with the
# rustfmt.toml when style decisions change.

[toolchain]
channel = "stable"
