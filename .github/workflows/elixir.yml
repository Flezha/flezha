name: Elixir

# Runs `mix test` — every ExUnit case except `:system` and `:java_sdk`,
# which are excluded in `test/test_helper.exs`. The Java SDK integration
# matrix (`:java_sdk`) runs in `java-sdk.yml` because it needs the Java
# runner jar built first; this workflow stays Elixir+Rust only.
#
# Native Java SDK binaries (libflz_transport.{so,dylib,dll} × 5 platforms)
# are committed under `sdk/java/flezha-sdk-native/src/main/resources/native/`
# — neither this workflow nor `java-sdk.yml` builds them. Refresh locally
# with `scripts/build-dist.sh` (rebuilds natives + SDK + test app jars
# in one shot) and commit.

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "protobufs/**"
      - "flz_transport/**"
      - "flz_nif/**"
      - "sdk/rust/**"
      - "cli/**"
      - "test/apps/rust_runner/**"
      - "test/apps/testnet/**"
      - ".github/workflows/elixir.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "protobufs/**"
      - "flz_transport/**"
      - "flz_nif/**"
      - "sdk/rust/**"
      - "cli/**"
      - "test/apps/rust_runner/**"
      - "test/apps/testnet/**"
      - ".github/workflows/elixir.yml"

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js (for testnet build)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache Elixir deps + build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: elixir-${{ runner.os }}-otp28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            elixir-${{ runner.os }}-otp28-

      - name: Cache Cargo registry + workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            test/apps/rust_runner/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache testnet node_modules
        uses: actions/cache@v5
        with:
          path: test/apps/testnet/node_modules
          key: testnet-${{ runner.os }}-${{ hashFiles('test/apps/testnet/package-lock.json', 'test/apps/testnet/package.json') }}

      - name: Install protoc (Protox runtime parses .proto, but the Rust
              workspace's prost path also needs the binary on $PATH)
        uses: arduino/setup-protoc@v3
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build testnet
        # Equivalent to `mix test.setup` (mix.exs alias) but with `npm ci`
        # for reproducible CI installs. Without the bundle the WS-dependent
        # ExUnit cases are auto-skipped at compile time; the inline build
        # keeps them in scope for CI.
        working-directory: test/apps/testnet
        run: |
          npm ci || npm install
          npm run build

      - name: Fetch Elixir deps
        run: mix deps.get

      - name: Compile Elixir (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Pre-build rust_runner
        # PortPilot launches two `cargo run --quiet` processes for
        # rust_runner at boot; BootLoader's post_hook gives
        # them 20s to connect (config/test.exs). A cold debug build
        # of the binary + workspace deps doesn't fit in that window,
        # so build it ahead of time into the same ./target dir the
        # cargo-run command uses.
        run: |
          cargo build --quiet \
            --manifest-path=test/apps/rust_runner/Cargo.toml \
            --target-dir=./target

      - name: Run Rust SDK tests
        # The only place the flz_core and flezha_runner crates' own unit and
        # integration tests run in CI. `entity_timers`, `sugar_emit` and
        # `simple_procedure` require the `testing` feature — without it cargo
        # skips them silently.
        run: |
          cargo test --quiet -p flz_core
          cargo test --quiet \
            -p flezha_runner --features bench-internals,testing \
            --lib --tests

      - name: Run mix test
        # Default `mix test` excludes `:system` and `:java_sdk`. The
        # `:java_sdk` integration matrix runs in `java-sdk.yml` because it
        # needs the Java runner jar built first; this workflow
        # stays Elixir+Rust only.
        run: |
          set -o pipefail
          mix test 2>&1 | tee /tmp/mix-test.log

      - name: Fail on uncaptured error logs
        # `config/test.exs` pins the logger to :error, so nothing below that
        # level can print. A test that drives a failure path on purpose must
        # wrap it in ExUnit.CaptureLog and assert the message; anything that
        # reaches the console is an unasserted error.
        run: |
          if grep -nE '\[(error|critical)\]' /tmp/mix-test.log; then
            echo "::error::uncaptured error/critical log during mix test — wrap the failure-path test in capture_log and assert the message"
            exit 1
          fi
