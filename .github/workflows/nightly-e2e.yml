name: Nightly E2E

# The `:system` and `:multi_node` suites are excluded from `mix test` (see
# `test/test_helper.exs`) and no other workflow passes `--include`, so until
# this job existed they had never run in CI at all. That is the suite that
# covers crash-resume, durability, compaction, DLQ, cell timers and
# cross-node migration — precisely the behaviour that breaks in production
# while a green `mix test` says nothing is wrong.
#
# Nightly rather than per-PR: these cases boot real runners and peer BEAMs, so
# they are slow and inherently more timing-sensitive than the unit suite. Also
# runnable on demand (`workflow_dispatch`) before a release, against any SDK
# runtime that carries a conformance manifest.
#
# The rows are quiet, as everywhere: a test that kills a runner or tears a
# channel down on purpose captures the error it causes and asserts it, so an
# uncaptured error-level line is still a finding here.

on:
  schedule:
    # 02:30 UTC daily.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      runtime:
        description: "SDK runtime to run the suite against"
        type: choice
        default: all
        options:
          - all
          - rust
          - java
          - elixir
          - node
          - ruby
          - php
          - python

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One job per SDK runtime, so a red job names the SDK that broke. The
  # schedule runs the two reference SDKs; a dispatch can pick any runtime that
  # carries a conformance manifest, and `all` is every one of them. The
  # runtimes are read from the manifests, so a manifest is the only place a
  # runtime is added.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.pick.outputs.runtimes }}
    env:
      SCHEDULE: '["rust","java"]'
      INPUT: ${{ github.event.inputs.runtime }}
    steps:
      # The test apps are links into the SDK submodules.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - id: pick
        run: |
          manifests=$(for m in test/apps/*_runner/conformance.json; do
            m=${m#test/apps/}; echo "${m%_runner/conformance.json}"; done)
          case "$INPUT" in
            "") runtimes=$SCHEDULE ;;
            all) runtimes=$(jq -Rnc '[inputs]' <<<"$manifests") ;;
            *) grep -qx -- "$INPUT" <<<"$manifests" ||
                 { echo "::error::no conformance manifest for runtime $INPUT"; exit 1; }
               runtimes=$(jq -Rnc '[inputs]' <<<"$INPUT") ;;
          esac
          echo "runtimes=$runtimes" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.matrix.outputs.runtimes) }}
        # The Node SDK's dispatch topology is an axis of the RUN, not a
        # property of a fixture file: one test app, run under the single-loop
        # default and under a worker-thread pool. Every other runtime has one
        # topology, so the second arm is excluded for them.
        workers: [0, 4]
        exclude:
          - runtime: rust
            workers: 4
          - runtime: java
            workers: 4
          - runtime: elixir
            workers: 4
          - runtime: ruby
            workers: 4
          - runtime: python
            workers: 4
          # PHP's second arm is its executor, not a worker count, and it runs
          # in `php-sdk.yml` on every change to the SDK rather than nightly.
          - runtime: php
            workers: 4
    name: e2e (${{ matrix.runtime }}${{ matrix.workers != 0 && format(', {0} workers', matrix.workers) || '' }})
    env:
      FLEZHA_E2E_RUNTIME: ${{ matrix.runtime }}
      FLEZHA_NODE_WORKERS: ${{ matrix.workers }}
      CONFORMANCE_OUT: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}.json
    steps:
      # Every runtime but Elixir is a submodule, pinned at the commit end to
      # end runs against.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Java
        if: matrix.runtime == 'java'
        uses: ./.github/actions/setup-java

      - name: Set up Node
        if: matrix.runtime == 'node'
        uses: ./.github/actions/setup-node

      - name: Set up Ruby
        if: matrix.runtime == 'ruby'
        uses: ./.github/actions/setup-ruby

      - name: Set up PHP
        if: matrix.runtime == 'php'
        uses: ./.github/actions/setup-php

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      # rb-sys runs bindgen over `ruby.h`, and bindgen needs clang's own
      # builtin headers.
      - name: Install libclang and its builtin headers
        if: matrix.runtime == 'ruby'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: The system and multi-node tiers under this runtime
        # The third-party dependencies, the warnings-as-errors compile and the
        # reference runner every case boots, then the rows of `@e2e-<runtime>`
        # in scripts/gate_rows.py (the runtime's runner built by its manifest,
        # the `:system` files in shards of six, on rust the plugin package
        # release test and on java the cross-SDK interop scenario) and the
        # multi-node tier.
        run: |
          python3 scripts/naming_gate.py \
            --run @deps,core-compile,core-prep-runner,@e2e-${{ matrix.runtime }},e2e-multi-node

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}
          path: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-data-${{ matrix.runtime }}-w${{ matrix.workers }}
          path: |
            storage/app/
          retention-days: 7
          if-no-files-found: ignore
