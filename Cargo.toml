[workspace]
# The Rust SDK, its macros and the reference runner are the `sdk/rust`
# submodule's crates, and the Elixir SDK's native library the `sdk/elixir` one's,
# named by their real paths: cargo resolves a manifest reached through the
# `test/apps/rust_runner` symlink against the link's name.
members = [
    "crates/flz_core",
    "crates/flz_core_ffi",
    "crates/flz_transport",
    "crates/flz_nif",
    "crates/cli",
    "sdk/rust",
    "sdk/rust/macros",
    "sdk/rust/test_app",
    "sdk/elixir/native/flz_core_beam",
]
resolver = "2"

# The Rust SDK and the Elixir SDK's native library take the core from its git
# tag, which is what their own repositories build against. Here the same source resolves to the crates in this tree, so a
# core change is seen by the SDK at once and nothing is fetched.
[patch."https://github.com/flezha/flezha"]
flz_core = { path = "crates/flz_core" }
flz_core_ffi = { path = "crates/flz_core_ffi" }
flz_transport = { path = "crates/flz_transport" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flezha/flezha"

# Every dependency two or more crates pin. A dependency exactly one crate uses
# stays in that crate, so this stays the shared-pin table and not a catalogue.
# Features are additive per crate: an entry here carries what every user of it
# needs, and a crate wanting more adds its own `features = [...]`.
[workspace.dependencies]
bytes = "1"
crc32fast = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
crossbeam = "0.8"
crossbeam-deque = "0.8"
dashmap = "6"
erased-serde = "0.4.6"
libc = "0.2"
mio = { version = "0.8.11", features = ["os-poll", "os-ext", "net"] }
postcard = { version = "1.0", features = ["use-std"] }
prost = "0.13.5"
quinn-proto = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tempfile = "3"
thiserror = "1.0"
tracing = "0.1"

# Every crate opts in with `[lints] workspace = true`. The clippy ceiling is
# stated in docs/public/contributing/code_standards.md, "Ceilings"; its threshold lives in crates/clippy.toml.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(loom)"] }

[workspace.lints.clippy]
cognitive_complexity = "warn"

# Debug artifacts are dominated by DWARF: without these, dependency debuginfo is
# re-embedded in full into every test and example binary in the workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
