name: Format

# Source-shape gate. Installs every toolchain the formatters need, then calls
# the gate runner once for the `format` group: every formatter in check mode,
# `reuse lint` (the per-path license map) and a freshness diff of the generated
# THIRD_PARTY_NOTICES.md. Failure blocks merge. Locally the same call is
# `python3 scripts/naming_gate.py --run @format`; auto-fix with
# `scripts/format-apply.sh`.
#
# CI keeps no list of its own, of formatters or of checks. Two lists drift: for
# a long time this workflow ran one formatter and nothing else, while a second
# local script claimed to cover the rest.
#
# Every SDK but Elixir is developed in a repository of its own and formatted by
# that repository's CI, so the formatters here are Rust's and Elixir's.

on:
  # An ignore-list, not an allow-list. The gate covers the whole tree, and an
  # allow-list that forgets a language is a gate that
  # silently stops covering it. Prose is the only thing exempt.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Nightly rustfmt is required because rustfmt.toml uses
      # `imports_granularity`, `group_imports`, and `ignore` — all
      # nightly-only. The date is pinned in .github/toolchains.json, which
      # scripts/format-apply.sh reads too; bump it there alongside
      # rustfmt.toml. No cargo cache: nothing here compiles.
      - name: Install Rust nightly (rustfmt)
        uses: ./.github/actions/setup-rust
        with:
          channel: nightly
          components: rustfmt
          cache: "false"

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Install reuse
        run: pip install reuse

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # One step, and CI keeps no list of its own. The three checks are rows in
      # the gate runner: the formatter driver (which prints a `==>` line per
      # language), the
      # per-path licence lint, and the freshness diff of the generated notices.
      # If an install step above ever stops working, the runner names the tool
      # it could not find, still reports every other check, and ends non-zero
      # instead of dropping one silently.
      - name: The source-shape gates
        run: python3 scripts/naming_gate.py --run @format
