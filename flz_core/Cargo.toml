[package]
name = "flz_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["use-std"] }
prost = "0.13.5"
flz_transport = { path = "../flz_transport" }
signal-hook = "0.3"
tracing = "0.1"
crc32fast = "1.4"
dashmap = "6"
serde_json = "1.0"
crossbeam = "0.8"
crossbeam-deque = "0.8"
lazy_static = "1.4.0"
thiserror = "1.0"
