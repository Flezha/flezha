name: Naming

# Repo-wide naming + boundary gates. The two operative kinds are `stream` and
# `workflow`; check-kind-naming fails a PR that reintroduces `bounded`/`unbounded`
# as a kind name. The three overflow policies are `DropNothing`/`DropNewest`/
# `DropOldest`; check-overflow-naming fails a PR that reintroduces `Block` as a
# policy name. Local mode is a way to run an application, not a way to test one;
# check-local-mode-naming fails a PR that names a local-mode symbol or its
# documentation page as testing material — `ProcedureTestHarness` and its
# per-SDK twins keep their names, and tests of local mode are out of that gate's
# scope by construction rather than by exemption.
# check-module-naming fails a PR that reintroduces one of the eight
# module paths retired for naming the wrong thing (the script lists them with
# their replacements). check-sdk-boundary keeps lib/flezha/sdk/ touching the
# controller only through the named packaging seams (prepares
# `package-elixir-sdk`).
# Deliberately unfiltered by path — the invariants cover docs and specs as much
# as code — and toolchain-free, so it costs nothing next to the Format gate.
# Local equivalents: the `scripts/check-*.sh` invoked below.
#
# check-docs-citations is the documentation gate: it fails a PR whose docs point
# at a module, function, file, `file:line`, environment variable or telemetry
# event the tree no longer carries. It judges only what has a decidable answer,
# and reports how many citations it read beside its verdict, because a green
# that means "stopped reading" is indistinguishable from a clean tree. Its scope
# is stated in the script: `openspec/specs/` is normative (a requirement may
# name what the code still owes) and the changelogs are dated records of what
# was removed, so both are out.
#
# check-layer-direction is the structure gate: a directory under lib/flezha/
# may not name a module whose own file lives in a higher one, and every module
# lives in some directory. A module's layer is read from where its FILE is, not
# from its name — Elixir module names are durable state here, so the
# restructuring ahead moves files and renames nothing, and a name-keyed count
# could never move. Its baseline, scripts/layer-direction-baseline.txt, is the
# debt the tree held when the gate landed; the gate fails on anything outside
# that list and on any entry the tree no longer holds, so the list may only
# shrink. Unlike scripts/refactor_metrics.py it belongs in CI: its baseline is
# tracked, so a fresh checkout can judge itself.
#
# check-mimic-global is the one path-scoped gate here: it reads `test/` only,
# because the call it refuses has no place in `lib/` at all. Mimic's global
# mode is process-group state, so a module that sets it without releasing it
# fails every stub in whichever module ExUnit happens to run next (KI-43).
# `test/helpers/mimic_global.ex` defines the releasing wrapper and is the one
# exemption, declared by path.
#
# Every gate here is a ROW in scripts/naming_gate.py, and `--run @naming` is the
# one reader. This file lists no gate by name, so a gate cannot be added to the
# repository and left uncalled by CI, which is what nine hand-written steps
# allowed. `--list` prints the table; `--run <id>` runs one.
#
# Most of these gates also share one walk (scripts/naming_gate.py), whose
# recorded-history escape hatch decides which lines each gate reads. Its
# self-test, itself a row, proves that escape scopes to its own block: it runs
# the walk over a throwaway git tree where a whole record on one line, a
# two-line block and a block left open each have a known answer, and it drives
# the exit contract over gates with known outcomes. A gate that says OK because
# it stopped reading is indistinguishable from one that says OK because the
# tree is clean.
#
# check-test-fixture refuses a test module that builds a fixture in its own
# `setup` and declares none; check-ci-toolchain refuses a workflow that sets a
# toolchain up itself instead of using the composite action that reads
# .github/toolchains.json. Both read DISK rather than the git index, because a
# file being written is exactly the work they should judge.
#
# check-build-artifacts is the repository-weight gate: `tracked` refuses a
# committed build artefact (native libraries and fat jars are build output —
# `scripts/build-native.sh` produces the one triple a test needs, and a release
# publishes all five), and `size` holds the packed repository under 150 MB.
# `size` needs the whole history, so its job checks out with fetch-depth 0. It is
# blocking: the purge reclaimed 961 MB -> 15 MB, and the ceiling is what keeps
# it there (docs/runbooks/purge-build-artifacts.md).
#
# There is no structure ratchet here, deliberately. scripts/refactor_metrics.py
# reads its baseline and targets from docs/refactor/, which is programme
# material this repository does not track, so on a fresh checkout the check
# exits 2 and can only ever be green by being ignored. It is a local instrument,
# run on a box that holds the baseline, and it does not belong in CI.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Every naming, structure and weight gate
        run: python3 scripts/naming_gate.py --run @naming

  repo-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check-build-artifacts size
        run: python3 scripts/naming_gate.py --run build-artifacts-size
