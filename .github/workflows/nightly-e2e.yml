name: Nightly E2E

# The `:system` and `:multi_node` suites are excluded from `mix test` (see
# `test/test_helper.exs`) and no other workflow passes `--include`, so until
# this job existed they had never run in CI at all. That is the suite that
# covers crash-resume, durability, compaction, DLQ, entity timers and
# cross-node migration — precisely the behaviour that breaks in production
# while a green `mix test` says nothing is wrong.
#
# Nightly rather than per-PR: these cases boot real runners and peer BEAMs, so
# they are slow and inherently more timing-sensitive than the unit suite. Also
# runnable on demand (`workflow_dispatch`) before a release, against any SDK
# runtime that carries a conformance manifest.
#
# Deliberately NOT carrying elixir.yml's "fail on uncaptured error logs" gate:
# these tests kill runners and tear down channels on purpose, so error-level
# logs are the expected output of the thing under test, not an unasserted
# failure.

on:
  schedule:
    # 02:30 UTC daily.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      runtime:
        description: "SDK runtime to run the suite against"
        type: choice
        default: all
        options:
          - all
          - rust
          - java
          - elixir
          - node

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One job per SDK runtime, so a red cell names the SDK that broke. The
  # schedule runs the two SDKs whose runners are committed artifacts; a
  # dispatch can pick any runtime that carries a conformance manifest.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.pick.outputs.runtimes }}
    steps:
      - id: pick
        run: |
          case "${{ github.event.inputs.runtime }}" in
            rust|java|elixir|node) echo "runtimes=[\"${{ github.event.inputs.runtime }}\"]" >> "$GITHUB_OUTPUT" ;;
            all)                   echo 'runtimes=["rust","java","elixir","node"]' >> "$GITHUB_OUTPUT" ;;
            *)                     echo 'runtimes=["rust","java"]' >> "$GITHUB_OUTPUT" ;;
          esac

  e2e:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.matrix.outputs.runtimes) }}
        # The Node SDK's dispatch topology is an axis of the RUN, not a
        # property of a fixture file: one test app, run under the single-loop
        # default and under a worker-thread pool. Every other runtime has one
        # topology, so the second arm is excluded for them.
        workers: [0, 4]
        exclude:
          - runtime: rust
            workers: 4
          - runtime: java
            workers: 4
          - runtime: elixir
            workers: 4
    name: e2e (${{ matrix.runtime }}${{ matrix.workers != 0 && format(', {0} workers', matrix.workers) || '' }})
    env:
      FLEZHA_E2E_RUNTIME: ${{ matrix.runtime }}
      FLEZHA_NODE_WORKERS: ${{ matrix.workers }}
      CONFORMANCE_OUT: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}.json
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node 22
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Elixir deps + build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: elixir-${{ runner.os }}-otp28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            elixir-${{ runner.os }}-otp28-

      - name: Cache Cargo registry + workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            test/apps/rust_runner/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Elixir deps
        run: mix deps.get

      - name: Compile Elixir (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Pre-build rust_runner
        # Every e2e case spawns runners through `cargo run`; a cold build does
        # not fit inside the connect budget the harness allows, so build the
        # binary into the same ./target dir the run command uses.
        run: |
          cargo build --quiet \
            --manifest-path=test/apps/rust_runner/Cargo.toml \
            --target-dir=./target

      - name: Pre-build the Node SDK and its test app
        if: matrix.runtime == 'node'
        # The addon, the dual-format package and the test app's dependency
        # link. No connect budget covers building a cdylib on first launch.
        run: scripts/build-node-sdk.sh

      - name: Pre-build the Elixir test runner
        if: matrix.runtime == 'elixir'
        # The standalone runner app compiles a whole flezha on its first
        # `mix run`, which no connect budget covers.
        run: cd test/apps/elixir_runner && mix compile

      - name: Run system + multi_node suites
        run: |
          mix test --include system --include multi_node \
            --formatter FlezhaTest.Helper.TimingFormatter \
            --formatter ExUnit.CLIFormatter

      - name: Run the cross-SDK interop scenario
        # The one scenario that places TWO runtimes in a single run, so it is
        # excluded from the tiers above and invoked on its own. It rides the
        # java job because that is the one with both a JDK and the pre-built
        # rust_runner; the runtime axis does not apply to it.
        if: matrix.runtime == 'java'
        run: |
          mix test --include system --include interop \
            test/system/cross_sdk_placement_e2e_test.exs

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}
          path: conformance-${{ matrix.runtime }}-w${{ matrix.workers }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-data-${{ matrix.runtime }}-w${{ matrix.workers }}
          path: |
            app_data/
          retention-days: 7
          if-no-files-found: ignore
