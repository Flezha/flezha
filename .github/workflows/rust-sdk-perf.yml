name: Rust SDK Perf

# Regression gate for the Rust SDK dispatch path. Builds the `fast-dispatch`
# feature, runs the Criterion micro-benches with --save-baseline pr, then
# compares against the baseline saved on main. Fails if dispatch throughput
# regresses by more than the tolerance set via REGRESSION_TOLERANCE_PCT.

on:
  pull_request:
    paths:
      - "sdk/rust"
      - "crates/flz_transport/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-sdk-perf.yml"
  # Mirror the PR path filters on push. A main commit that doesn't touch
  # dispatch-relevant code can't change the perf baseline, so the previous
  # cached `rust-sdk-perf-main-*` baseline remains valid for future PR diffs.
  push:
    branches: [main]
    paths:
      - "sdk/rust"
      - "crates/flz_transport/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-sdk-perf.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  REGRESSION_TOLERANCE_PCT: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      # ---------------------------------------------------------------------
      # On `push: main` we capture a fresh baseline called `main` and save it
      # to Actions cache so future PRs can download and compare.
      # ---------------------------------------------------------------------
      - name: Build fast-dispatch benches
        run: |
          cargo build --release \
            -p flezha_runner \
            --features bench-internals \
            --bench dispatch
          cargo build --release \
            -p flezha_runner \
            --features bench-internals \
            --bench correctness

      - name: Run correctness bench (fail if any invariant violated)
        run: |
          BIN=$(ls _build/.target/release/deps/correctness-* | grep -v '\.d$' | head -1)
          "$BIN"

      - name: Run dispatch bench — baseline "pr" (PRs) or "main" (push)
        id: run-bench
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASELINE=main
          else
            BASELINE=pr
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          cargo bench -p flezha_runner \
            --features bench-internals \
            --bench dispatch \
            -- --save-baseline "$BASELINE"

      # ---------------------------------------------------------------------
      # PR gate: download the main baseline (if available) and diff.
      # The Criterion output under `_build/.target/criterion/<bench>/<id>/change/`
      # contains the change percentage; we parse those and fail if any
      # exceeds the tolerance.
      # ---------------------------------------------------------------------
      - name: Download main baseline (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v5
        id: restore-main
        with:
          path: _build/.target/criterion
          key: rust-sdk-perf-main-${{ github.sha }}
          restore-keys: |
            rust-sdk-perf-main-

      # Until a push to main has saved a baseline there is nothing to compare.
      - name: Compare PR vs main
        if: ${{ github.event_name == 'pull_request' && steps.restore-main.outputs.cache-matched-key != '' }}
        run: |
          set -euo pipefail
          # Re-run benches comparing against the cached "main" baseline.
          # Criterion prints a line like `change: [-1.234% -0.456% +0.789%]`
          # per bench; the middle value is the estimated change.
          LOG=$(cargo bench -p flezha_runner \
            --features bench-internals \
            --bench dispatch \
            -- --baseline main 2>&1 | tee /dev/stderr)
          REGRESSED=0
          while IFS= read -r line; do
            # Look for the estimated change line (middle value). Positive
            # percentages on throughput-named benches mean SLOWER.
            if echo "$line" | grep -qE 'change:.*\[.*%.*%.*%\]'; then
              MID=$(echo "$line" | sed -E 's/.*\[[^ ]+ ([+-]?[0-9.]+)%.*/\1/')
              # Tolerate ≤ REGRESSION_TOLERANCE_PCT increase. On throughput
              # benches (names contain "throughput_"), an increase in time
              # is a regression.
              THRESHOLD=${REGRESSION_TOLERANCE_PCT}
              AWK_OUT=$(awk -v a="$MID" -v t="$THRESHOLD" 'BEGIN { if (a > t) print "bad"; else print "ok" }')
              if [[ "$AWK_OUT" == "bad" ]]; then
                echo "::error::Perf regression detected: change = ${MID}% (tolerance ${THRESHOLD}%)"
                REGRESSED=1
              fi
            fi
          done <<< "$LOG"
          if [[ $REGRESSED -ne 0 ]]; then
            exit 1
          fi

      - name: Save main baseline to cache (push only)
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v5
        with:
          path: _build/.target/criterion
          key: rust-sdk-perf-main-${{ github.sha }}

      - name: Upload Criterion report as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: criterion-report-${{ github.sha }}
          path: _build/.target/criterion
          retention-days: 30
