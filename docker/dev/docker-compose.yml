services:
  agent:
    # TODO: remove the build section later.
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.agent
    container_name: flezha_agent_dev
    # TODO:   image: flezha:latest
    environment:
      FLEZHA_SOCKET_FILES_PATH: /flezha/app_data/sockets/
    depends_on:
      - kafka
    volumes:
      - socket_data:/socket_data
      - ../../:/flezha
      - /flezha/_build
      - /flezha/cli/target
    networks:
      - flezha_network

  zookeeper:
    image: zookeeper:3.9.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - flezha_network

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - flezha_network

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - flezha_network

  # rust:
  #   build:
  #     context: ../test/apps/rust_compute_engine
  #     dockerfile: ./Dockerfile.rust
  #   volumes:
  #     - socket_data:/socket_data

volumes:
  socket_data:
    driver: local

networks:
  flezha_network:
    external: true
