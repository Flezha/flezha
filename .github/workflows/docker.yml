name: Docker

# Builds the prod (`:latest`) and runtime-dev (`:latest-dev`) controller images
# and fails if either exceeds its size budget. On push to main, also
# pushes both tags to Docker Hub. The toolchain image (`:latest-toolchain`)
# is build-only for hacking on Flezha itself and is not published from CI;
# the maintainer publishes it from a workstation when needed.
#
# Per the no-QEMU/buildx policy, multi-arch images are produced by
# building natively on each architecture's own runner (the matrix below).
# Cross-compilation via QEMU is forbidden.

on:
  pull_request:
    paths:
      - "docker/prod/**"
      - "docker/dev/Dockerfile.runtime"
      - "test/apps/testnet/**"
      - "mix.exs"
      - "mix.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flz_nif/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "docker/prod/**"
      - "docker/dev/Dockerfile.runtime"
      - "test/apps/testnet/**"
      - "mix.exs"
      - "mix.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flz_nif/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

env:
  # 300 MiB. Documented in docker/prod/README.md.
  PROD_IMAGE_SIZE_LIMIT_BYTES: 314572800
  # 450 MiB — prod budget plus an allowance for Node.js runtime and the
  # built testnet bundle. Documented in the controller-packaging spec.
  RUNTIME_DEV_IMAGE_SIZE_LIMIT_BYTES: 471859200

jobs:
  docker-size-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build prod image
        run: |
          docker build \
            -f docker/prod/Dockerfile.controller \
            -t alfetahe/flezha:latest \
            .

      - name: Build runtime-dev image (FROM :latest)
        run: |
          docker build \
            -f docker/dev/Dockerfile.runtime \
            -t alfetahe/flezha:latest-dev \
            .

      - name: Measure image sizes
        id: size
        run: |
          PROD_SIZE=$(docker image inspect alfetahe/flezha:latest --format '{{.Size}}')
          DEV_SIZE=$(docker image inspect alfetahe/flezha:latest-dev --format '{{.Size}}')
          mb() { awk "BEGIN { printf \"%.1f\", $1/1024/1024 }"; }
          PROD_MB=$(mb "$PROD_SIZE")
          DEV_MB=$(mb "$DEV_SIZE")
          PROD_LIMIT_MB=$(mb "$PROD_IMAGE_SIZE_LIMIT_BYTES")
          DEV_LIMIT_MB=$(mb "$RUNTIME_DEV_IMAGE_SIZE_LIMIT_BYTES")
          {
            echo "prod_size_bytes=${PROD_SIZE}"
            echo "prod_size_mb=${PROD_MB}"
            echo "prod_limit_mb=${PROD_LIMIT_MB}"
            echo "dev_size_bytes=${DEV_SIZE}"
            echo "dev_size_mb=${DEV_MB}"
            echo "dev_limit_mb=${DEV_LIMIT_MB}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Image sizes"
            echo ""
            echo "| Tag | Size | Limit |"
            echo "|-----|------|-------|"
            echo "| \`alfetahe/flezha:latest\` | ${PROD_MB} MiB | ${PROD_LIMIT_MB} MiB |"
            echo "| \`alfetahe/flezha:latest-dev\` | ${DEV_MB} MiB | ${DEV_LIMIT_MB} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce size budgets
        run: |
          fail=0
          if [ "${{ steps.size.outputs.prod_size_bytes }}" -gt "${PROD_IMAGE_SIZE_LIMIT_BYTES}" ]; then
            echo "::error::prod image ${{ steps.size.outputs.prod_size_mb }} MiB exceeds threshold ${{ steps.size.outputs.prod_limit_mb }} MiB"
            fail=1
          fi
          if [ "${{ steps.size.outputs.dev_size_bytes }}" -gt "${RUNTIME_DEV_IMAGE_SIZE_LIMIT_BYTES}" ]; then
            echo "::error::runtime-dev image ${{ steps.size.outputs.dev_size_mb }} MiB exceeds threshold ${{ steps.size.outputs.dev_limit_mb }} MiB"
            fail=1
          fi
          exit "$fail"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push :latest and :latest-dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push alfetahe/flezha:latest
          docker push alfetahe/flezha:latest-dev
