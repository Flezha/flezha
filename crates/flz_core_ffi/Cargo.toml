[package]
name = "flz_core_ffi"
version.workspace = true
edition.workspace = true
description = "C ABI and JNI bindings over flz_core for non-Rust Flezha SDK hosts"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# JNI exports for the Java SDK's `FlzCore` class — same binary, same ABI,
# the JNI layer is a one-to-one veneer over the C entry points.
jni = ["dep:jni"]
# N-API exports for the Node SDK's native binding — same binary, same ABI,
# the napi layer is a one-to-one veneer over the C entry points. Additive:
# the crate's `cdylib` / `staticlib` / `rlib` artifacts and the `jni` build
# are unchanged, and the `.node` addon is the `cdylib` under another name.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# Ruby exports for the `flezha` gem's native extension — same binary, same
# ABI, the magnus layer is a one-to-one veneer over the C entry points.
# Additive in exactly the way `napi` is: the `cdylib` the extension loads is
# the crate's ordinary one under another name.
ruby = ["dep:magnus", "dep:rb-sys", "dep:rb-sys-env"]
# `ruby` plus an embedded CRuby VM, so the veneer's mapping is exercisable
# from an ordinary Rust test binary with no Ruby process involved. Its own
# feature rather than a dev-dependency: a dev-dependency on `magnus` would
# make every `cargo test --workspace` on a machine without Ruby fail to
# build, and this crate's whole point is that it builds without any of them.
ruby-embed = ["ruby", "magnus/embed"]
# PyO3 exports for the `flezha` wheel's native module — same binary, same ABI,
# the pyo3 layer is a one-to-one veneer over the C entry points. Additive in
# exactly the way `napi` and `ruby` are: the `cdylib` the wheel loads is the
# crate's ordinary one under another name. Deliberately WITHOUT
# `pyo3/extension-module`, so a Rust test binary can link libpython and drive
# the veneer with no Python process involved — the wheel build adds it.
python = ["dep:pyo3", "dep:pyo3-build-config"]
# What maturin builds: the veneer as a CPython extension module, which must not
# link libpython itself. Its own feature rather than the default, because a
# test binary built with it cannot resolve a single CPython symbol at link time.
python-extension = ["python", "pyo3/extension-module"]
# The `abi3` compatibility tier: one wheel per platform, targeting the declared
# floor. The free-threaded tier builds without it — `abi3` has no free-threaded
# form before CPython 3.15's `abi3t` — which is the whole reason the two tiers
# are two cargo invocations rather than one.
python-abi3 = ["python", "pyo3/abi3-py311"]
# The control-socket peer a runner meets when there is no controller, as a
# public module and as `flz-fake-controller`. Behind a feature the way
# `flz_transport` keeps `test-support`: nothing a released veneer links, and
# the only thing in this crate that needs a protobuf encoder of its own.
fake-controller = ["dep:prost"]

[dependencies]
flz_core = { path = "../flz_core" }
flz_transport = { path = "../flz_transport" }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
dashmap.workspace = true
crossbeam.workspace = true
jni = { version = "0.21", optional = true }
# `napi9` is the N-API version floor: Node 20 is the oldest release in the
# SDK's support window and every release in it speaks 9 or better.
# `dyn-symbols` resolves the N-API symbols from the host at load time instead
# of at link time, which is what lets the veneer's mapping be exercised from
# an ordinary Rust test binary. Deliberately NOT `async`: that feature is
# tokio, and the blocking entry points run on this host's own pool.
napi = { version = "3.12", default-features = false, features = [
    "napi9",
    "dyn-symbols",
], optional = true }
napi-derive = { version = "3.6", default-features = false, optional = true }
# `magnus` is the high-level CRuby binding; `rb-sys` is the raw one underneath
# it, needed directly for `rb_thread_call_without_gvl` — magnus has no safe
# wrapper for releasing the GVL, and every blocking core call must.
magnus = { version = "0.8", default-features = false, optional = true }
rb-sys = { version = "0.9", optional = true }
# `pyo3` is the CPython binding. `auto-initialize` is what lets an ordinary
# Rust test binary start an interpreter, which is how the veneer's mapping is
# proved with no Python process involved; it is inert in the wheel, where
# CPython is already running.
pyo3 = { version = "0.29", default-features = false, features = [
    "macros",
    "auto-initialize",
], optional = true }
prost = { workspace = true, optional = true }

[build-dependencies]
napi-build = { version = "2.4", optional = true }
rb-sys-env = { version = "0.2", optional = true }
pyo3-build-config = { version = "0.29", optional = true }

[dev-dependencies]
flz_core = { path = "../flz_core", features = ["bench-internals", "test-support"] }
# This crate, with its fake controller turned on: the ABI scenario drives the
# same module `flz-fake-controller` does, so the tests and the binary cannot
# hold two readings of the wire. The pattern `flz_core` uses for
# `flz_transport`'s `test-support`, pointed at this package.
flz_core_ffi = { path = ".", features = ["fake-controller"] }
criterion.workspace = true
libc.workspace = true
prost.workspace = true

[[bin]]
name = "flz-fake-controller"
path = "src/bin/flz-fake-controller.rs"
required-features = ["fake-controller"]

[[bench]]
name = "host_loop"
harness = false

[lints]
workspace = true
