name: Bench Regression Gate

# Two jobs, and no throughput number fails either:
# - bench-regression: mix bench --shape regression, reporting the end-to-end
#   and receive-window rates. Fails only when the bench itself fails or its
#   report carries no rate.
# - bench-cell-scaling (informational): mix bench --shape
#   cell --pool-sizes 1,8 reports the ratio to the PR check
#   output but does not gate the merge.

on:
  pull_request:
    paths:
      - "sdk/rust"
      - "flz_transport/**"
      - "flz_nif/**"
      - "lib/flezha/**"
      - "lib/mix/tasks/bench**"
      - "protobufs/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Build Rust compute engine (release)
        run: cargo build --release -p rust_runner

      - name: Run mix bench --shape regression
        run: |
          set -euo pipefail
          MIX_ENV=prod mix bench --runtime rust --shape regression -n 100 -m 10000 \
            2>&1 | tee bench-regression.log
          # The run's structured report is the machine contract: the printed
          # rendering is for humans and is free to change without breaking
          # this job. Under `pipefail` a run that wrote no report fails here.
          REPORT=$(ls -1t bench/reports/bench-rust-regression-*.json | head -1)
          END_TO_END=$(jq -r '.metrics.throughput_msg_per_sec' "$REPORT")
          RECEIVE=$(jq -r '.metrics.receive_window_msg_per_sec' "$REPORT")
          if [[ "$END_TO_END" == "null" || "$RECEIVE" == "null" ]]; then
            echo "::error::No throughput in $REPORT"
            tail -50 bench-regression.log
            exit 1
          fi
          # Any preflight warning the run raised belongs in the job log: it is
          # why a number is what it is.
          jq -r '.warnings[]? | "::warning::bench preflight: " + .' "$REPORT"
          {
            echo "## Regression bench (no throughput threshold)"
            echo
            echo "- end-to-end window: **${END_TO_END}** msg/s"
            echo "- receive window: **${RECEIVE}** msg/s"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bench log artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-regression-${{ github.sha }}
          path: |
            bench-regression.log
            bench/reports/
          retention-days: 30

  bench-cell-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational. GitHub Actions runners are virtualized and the 4×
    # ratio scenario isn't a reliable signal on shared hosts; checked
    # manually on real hardware before merging cross-cutting changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Build Rust compute engine (release)
        run: cargo build --release -p rust_runner

      - name: Run mix bench --shape cell --pool-sizes 1,8
        id: scaling
        run: |
          set -euo pipefail
          MIX_ENV=prod mix bench --runtime rust --shape cell --pool-sizes 1,8 \
            2>&1 | tee bench-scaling.log
          REPORT=$(ls -1t bench/reports/bench-rust-cell-*.json 2>/dev/null | head -1 || true)
          RATIO=$(jq -r '.metrics.scaling_ratio // empty' "${REPORT:-/dev/null}" 2>/dev/null || true)
          if [[ -z "$RATIO" ]]; then
            echo "::warning::Could not parse 'ratio (max/min)' from scaling output"
            echo "ratio=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "ratio=$RATIO" >> "$GITHUB_OUTPUT"
          fi

      - name: Report scaling ratio
        run: |
          RATIO="${{ steps.scaling.outputs.ratio }}"
          {
            echo "## Cell scaling — informational"
            echo
            echo "Measured ratio (pool=8 / pool=1): **${RATIO}**"
            echo
            echo "Spec target: ≥ 4× on real 8-core hardware. CI ratio is informational"
            echo "per relay-bench-harness/design.md Decision 9 — GitHub Actions runners"
            echo "are virtualized and don't reliably expose 8 physical cores."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench log artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-scaling-${{ github.sha }}
          path: bench-scaling.log
          retention-days: 30
