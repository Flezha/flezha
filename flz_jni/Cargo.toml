[package]
name = "flz_jni"
version = "0.1.0"
edition = "2021"
description = "JNI bindings exposing flz_transport's C FFI to the Flezha Java SDK"

[lib]
name = "flz_jni"
crate-type = ["cdylib"]

[dependencies]
flz_transport = { path = "../flz_transport" }
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }
