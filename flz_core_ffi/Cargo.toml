[package]
name = "flz_core_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# JNI exports for the Java SDK's `FlzCore` class — same binary, same ABI,
# the JNI layer is a one-to-one veneer over the C entry points.
jni = ["dep:jni"]

[dependencies]
flz_core = { path = "../flz_core" }
flz_transport = { path = "../flz_transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"
crossbeam = "0.8"
jni = { version = "0.21", optional = true }

[dev-dependencies]
prost = "0.13.5"
postcard = { version = "1.0", features = ["use-std"] }
crc32fast = "1.4"
