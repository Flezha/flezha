[package]
name = "flz_core"
version.workspace = true
edition.workspace = true
description = "Flezha SDK kernel — poll-based dispatch, durable state, retries, timers and transport shared by the Rust and Java SDKs"
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
postcard.workspace = true
prost.workspace = true
flz_transport = { version = "0.1.0", path = "../flz_transport" }
signal-hook.workspace = true
tracing.workspace = true
crc32fast.workspace = true
dashmap.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
crossbeam.workspace = true
crossbeam-deque.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The same path dependency the crate already has, with the QUIC test peers
# turned on: `flz_nif` reaches them the same way, so the connect tests drive
# one definition of a vanished controller rather than a second copy.
flz_transport = { path = "../flz_transport", features = ["test-support"] }

[features]
# The bench scaffolding `flz_core_ffi`'s `host_loop` and the `sdk/rust`
# benches share. NOT a stable public API.
bench-internals = ["test-support"]
# The test scaffolding and the WAL record encoder, for the tests of the crates
# built on this one. NOT a stable public API.
test-support = []

[lints]
workspace = true
