[package]
name = "flz_core_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flz_core = { path = "../flz_core" }
flz_transport = { path = "../flz_transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"
crossbeam = "0.8"

[dev-dependencies]
prost = "0.13.5"
