[package]
name = "flz_nif"
version = "0.1.0"
edition = "2021"
description = "Rustler NIF wrapping flz_transport for the Elixir controller"

[lib]
name = "flz_nif"
crate-type = ["cdylib"]

[dependencies]
flz_transport = { path = "../flz_transport" }
rustler = "0.35"
crossbeam = "0.8"
mio = { version = "0.8.11", features = ["os-poll", "os-ext", "net"] }
quinn-proto = "0.11"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
