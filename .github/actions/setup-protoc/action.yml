name: Set up protoc
description: >
  The protobuf compiler at the version .github/toolchains.json names.

# `mix compile` runs Protox over the .proto files and Protox shells out to a
# system protoc, and the Rust workspace's prost path needs the same binary on
# PATH. One version for both, from the manifest, because a controller and a
# runner that disagree about the compiler disagree about the wire.

inputs:
  version:
    description: Override the manifest's protoc version. Empty reads the manifest.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve the protoc version
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION:-$("${GITHUB_WORKSPACE}/scripts/manifest_pin.sh" "${GITHUB_WORKSPACE}/.github/toolchains.json" protoc)}"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - uses: arduino/setup-protoc@v3
      with:
        version: ${{ steps.resolve.outputs.version }}
        repo-token: ${{ github.token }}
