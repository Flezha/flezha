[workspace]
members = [
    "flz_core",
    "flz_core_ffi",
    "flz_transport",
    "flz_nif",
    "flezha-macros",
    "sdk/rust",
    "cli",
    "test/apps/rust_runner",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/alfetahe/flezha"

# Debug artifacts are dominated by DWARF: without these, dependency debuginfo is
# re-embedded in full into every test and example binary in the workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
