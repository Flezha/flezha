name: Elixir

# Runs the `core` gate rows: every ExUnit case except `:system`, which is
# excluded in `test/test_helper.exs`. That includes the SDK conformance gate
# (`test/sdk_conformance/gate_test.exs`), which is untagged and spawns no
# runner. The runner-backed smoke tier runs in each SDK's workflow and the full
# `:system` suite in `nightly-e2e.yml`; this workflow stays Elixir+Rust only.
#
# Nothing here touches the Java SDK's native binary: the conformance gate reads
# manifests, not runners. `java-sdk.yml` builds the host triple it needs with
# `scripts/build-native.sh`; no build artefact is tracked in git.

on:
  # Also by hand, from the Actions tab or `gh workflow run elixir.yml`.
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "crates/protobufs/**"
      - "crates/flz_core/**"
      - "crates/flz_transport/**"
      - "crates/flz_nif/**"
      - "sdk/rust"
      - "sdk/elixir"
      - "crates/cli/**"
      - "test/apps/testnet"
      - "test/apps/testnet/**"
      - ".github/workflows/elixir.yml"
      - "scripts/gate_rows.py"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "crates/protobufs/**"
      - "crates/flz_core/**"
      - "crates/flz_transport/**"
      - "crates/flz_nif/**"
      - "sdk/rust"
      - "sdk/elixir"
      - "crates/cli/**"
      - "test/apps/testnet"
      - "test/apps/testnet/**"
      - ".github/workflows/elixir.yml"
      - "scripts/gate_rows.py"

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Erlang + Elixir
        uses: ./.github/actions/setup-beam

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Node.js (for testnet build)
        uses: ./.github/actions/setup-node
        with:
          deps-dir: test/apps/testnet

      - name: Install protoc (Protox parses .proto at runtime; the
              proto-fresh row regenerates the prost output with protoc)
        uses: ./.github/actions/setup-protoc

      - name: The core gates
        # Every row of `@core` in scripts/gate_rows.py (the warnings-as-errors
        # compile, the testnet bundle, the runner and certificates the suites
        # boot against, then `mix test --warnings-as-errors` split by
        # directory) and the Rust crates' own tests. Each row is quiet: an
        # uncaptured [error] line fails it, so a test that drives a failure path
        # wraps it in ExUnit.CaptureLog and asserts the message. `@contract`
        # regenerates the committed prost output and fails on a diff.
        run: python3 scripts/run_gates.py --run @core,rust-test-core,rust-test-runner,@contract

  # Every Rust crate and target compiled for both Apple chips with warnings
  # denied, on a push to main: it cross-compiles, which no pull-request job does.
  macos-compile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Install cargo-zigbuild, zig and the Apple targets
        run: scripts/ensure-zig.sh aarch64-apple-darwin x86_64-apple-darwin

      - run: python3 scripts/run_gates.py --run @macos
