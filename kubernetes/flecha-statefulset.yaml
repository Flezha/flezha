apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flecha-core-statefulset
  namespace: flecha
spec:
  serviceName: "flecha-core"
  replicas: 3
  selector:
    matchLabels:
      app: flecha-core
  template:
    metadata:
      labels:
        app: flecha-core
    spec:
      containers:
        - name: flecha-core
          image: alfetahe/flecha:0.1.4
          ports:
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            - name: FLECHA_NODE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLECHA_CLUSTER_DISCOVERY            
              value: "k8s_pod_discovery"
            - name: FLECHA_RECONNECT_INTERVAL
              value: "2"
            - name: FLECHA_MAX_RECONNECTS
              value: "10"
            - name: FLECHA_NODE_NAME
              value: "flecha_core"
            - name: FLECHA_K8S_IP_LOOKUP_MODE
              value: "pods"
            - name: FLECHA_K8S_NAMESPACE
              value: "flecha"
            - name: FLECHA_K8S_SERVICE_NAME
              value: "flecha"
            - name: FLECHA_K8S_SELECTOR
              value: "app=flecha-core"
            - name: FLECHA_K8S_MASTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP          
  volumeClaimTemplates:
    - metadata:
        name: flecha-core-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi